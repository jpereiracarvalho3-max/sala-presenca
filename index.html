<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventos dos Bêbados</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="theme-color" content="#2457F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bêbados">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* Conceito: uma sala de encontro ilustrada no alto; quem validou a presença aparece dentro da sala, quem faltou fica na porta. Abas simples e cartões claros embaixo. */
:root{
  --bg:#EDF0F7; --surface:#FFFFFF; --soft:#F5F7FC; --ink:#1B2140; --muted:#586080; --line:#D8DDEC;
  --accent:#2457F5; --accent-ink:#FFFFFF; --ok:#13804D; --warn:#A86A00; --bad:#C7362F; --info:#2A64B0;
  --ok-bg:#DDF3E8; --warn-bg:#FBEBCB; --bad-bg:#FADCDA; --info-bg:#DCE9F9;
  --wall:#DCE3F5; --floor:#D8C8AA; --floor2:#CFBD9C; --door:#8A94B8;
  --font-head:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141829; --surface:#1D2240; --soft:#252B4F; --ink:#E9ECFA; --muted:#A0A9CC; --line:#323A66;
    --accent:#8FA8FF; --accent-ink:#0E1330; --ok:#5CD49A; --warn:#F0B84A; --bad:#FF8A82; --info:#8FBCFF;
    --ok-bg:#16382A; --warn-bg:#43330F; --bad-bg:#47201F; --info-bg:#1C3354;
    --wall:#2A3160; --floor:#4A4160; --floor2:#433A59; --door:#5B6599; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141829; --surface:#1D2240; --soft:#252B4F; --ink:#E9ECFA; --muted:#A0A9CC; --line:#323A66;
  --accent:#8FA8FF; --accent-ink:#0E1330; --ok:#5CD49A; --warn:#F0B84A; --bad:#FF8A82; --info:#8FBCFF;
  --ok-bg:#16382A; --warn-bg:#43330F; --bad-bg:#47201F; --info-bg:#1C3354;
  --wall:#2A3160; --floor:#4A4160; --floor2:#433A59; --door:#5B6599; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:0;background:transparent;padding:9px 4px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 1px 2px rgba(27,33,64,.04),0 10px 28px rgba(27,33,64,.07)}
.top h1{background:linear-gradient(90deg,var(--accent),#7048E8);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em}
.room{box-shadow:0 10px 28px rgba(27,33,64,.10)}
.btn{transition:transform .08s ease,filter .12s ease}
.btn:active{transform:scale(.97)}
.item{transition:box-shadow .15s ease}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:var(--ok);color:#fff;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tabs button:focus-visible,.fig:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
/* sala */
.room{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.wall{background:var(--wall);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:64px}
.wall .place{font-family:var(--font-head);font-weight:700;font-size:16px}
.door{width:34px;height:52px;border-radius:6px 6px 0 0;background:var(--door);position:relative;flex:none;margin-bottom:-12px}
.door::after{content:"";position:absolute;right:6px;top:26px;width:5px;height:5px;border-radius:50%;background:var(--wall)}
.floor{background:repeating-linear-gradient(90deg,var(--floor) 0 46px,var(--floor2) 46px 48px);padding:16px 10px 14px;display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center;align-items:flex-end;min-height:150px}
.floor .none{align-self:center;color:var(--ink);opacity:.7;font-weight:600;text-align:center;padding:10px}
.fig{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 4px 2px;width:74px;cursor:default;color:var(--ink)}
.fig.clickable{cursor:pointer}
.fig svg{display:block}
.fig span{font-size:12.5px;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fig.out svg{filter:grayscale(1);opacity:.5}
.fig.susp svg{filter:grayscale(1) sepia(.6) hue-rotate(-30deg);opacity:.6}
.doorstep{display:flex;flex-wrap:wrap;gap:2px 4px;justify-content:center;padding:10px;background:var(--soft);border-top:1px solid var(--line)}
.doorstep .cap{width:100%;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.codebox{font-family:var(--font-head);font-size:38px;font-weight:700;letter-spacing:.18em;text-align:center;padding:10px 6px;background:var(--soft);border-radius:12px;border:1px dashed var(--line)}
.qrwrap{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.presente{background:var(--ok)} .dot.falta{background:var(--bad)} .dot.abonada{background:var(--info)} .dot.suspenso{background:var(--muted)} .dot.analise{background:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--soft);min-width:0}
.item p{margin:0;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}

/* temas da sala */
.floor{position:relative;overflow:hidden}
.fig{position:relative;z-index:1}
.wall .decor{display:block;width:100%;height:60px}
.wall.themed{display:block;padding:0;min-height:0}
.wall.themed .wtxt{padding:12px 16px 6px}
.th-festa .wall{background:#2d1457;color:#fff}.th-festa .wall .muted{color:#d9ccf5}
.th-cinema .wall{background:#2a0a10;color:#fff}.th-cinema .wall .muted{color:#e7c9cf}
.th-jantar .wall{background:#efd9b0;color:#3b2a14}.th-jantar .wall .muted{color:#6b5636}
.th-churrasco .wall{background:#9bd8f5;color:#16384a}.th-churrasco .wall .muted{color:#2f5870}
.th-festa .floor{background:repeating-conic-gradient(#3a1b6e 0 25%,#4b2590 0 50%) 0 0/48px 48px}
.th-festa .floor::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(255,77,109,.38),transparent 38%),radial-gradient(circle at 75% 60%,rgba(77,171,247,.38),transparent 40%),radial-gradient(circle at 50% 90%,rgba(255,212,59,.3),transparent 35%);background-size:200% 200%;animation:lights 6s ease-in-out infinite alternate}
@keyframes lights{from{background-position:0 0}to{background-position:100% 100%}}
.th-cinema .floor{background:repeating-linear-gradient(90deg,#5d1020 0 22px,#4b0c19 22px 24px)}
.th-jantar .floor{background:repeating-linear-gradient(0deg,#b98a5b 0 30px,#a97b4d 30px 32px)}
.th-jantar .floor::before{content:"";position:absolute;left:10%;right:10%;bottom:12px;height:46px;border-radius:50%;background:#fff7e8;box-shadow:0 7px 0 #d8c29d}
.th-churrasco .floor{background:repeating-linear-gradient(90deg,#7cc06a 0 40px,#72b560 40px 80px)}
.th-festa .floor .fig,.th-cinema .floor .fig,.th-cinema .floor .none,.th-festa .floor .none{color:#fff}
.th-festa .floor .fig span,.th-cinema .floor .fig span{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.th-churrasco .floor .fig,.th-churrasco .floor .none{color:#10321a}
.th-jantar .floor .fig,.th-jantar .floor .none{color:#2d1d0c}
.th-jantar .floor .fig span{text-shadow:0 1px 2px rgba(255,255,255,.5)}
/* movimento */
.floor.stage{display:block;height:240px;min-height:240px;padding:0}
.stage .fig{position:absolute;left:50%;top:115%;width:74px;height:100px;padding:0;margin:0;transform:translate(-50%,-100%);justify-content:flex-end}
.stage .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.floor.stage.online{height:390px;min-height:390px}
.stage.online.canwalk{cursor:pointer}
.mesa{position:absolute;transform:translate(-50%,-66%);width:min(112px,30%);height:60px;border-radius:50%;background:#8A5A2B;border:3px solid #5F3D1C;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.22);padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mesa::before{content:'';position:absolute;inset:-16px}
.mesa:active{filter:brightness(1.15)}
.stage.online .fig{pointer-events:none}
.mesa.mine{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent)}
a.btn{text-decoration:none;text-align:center;display:block}
.fig .bw{display:flex;justify-content:center}
.fig svg{overflow:visible}
.stage .fig{flex-direction:column-reverse;justify-content:flex-start;gap:4px}
.room .floor.stage .fig span{background:rgba(255,255,255,.9);color:#1B2140;padding:1px 7px;border-radius:9px;text-shadow:none;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.fig.guest span{font-style:italic}
.react{position:absolute;left:50%;top:-10px;font-size:28px;font-style:normal;line-height:1;pointer-events:none;z-index:6;animation:reactUp 4s ease-out forwards}
@keyframes reactUp{0%{opacity:0;transform:translate(-50%,12px) scale(.5)}12%{opacity:1;transform:translate(-50%,-6px) scale(1.2)}75%{opacity:1;transform:translate(-50%,-18px) scale(1)}100%{opacity:0;transform:translate(-50%,-36px) scale(1)}}
.emo{font-size:24px;line-height:1;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--soft);cursor:pointer;touch-action:manipulation}
.emo:active{transform:scale(1.2)}
.btn[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.smk{animation:smk 2.4s ease-in-out infinite}
.led{animation:led 1s steps(1) infinite}
.led2{animation-delay:.5s}
@keyframes led{0%{opacity:1}50%{opacity:.18}}
@keyframes smk{0%{opacity:0;transform:translateY(3px)}40%{opacity:.75}100%{opacity:0;transform:translateY(-4px)}}
.stage .fig.walking .bw svg{animation:hop .45s ease-in-out infinite}
.stage .fig.idle .bw svg{animation:sit 3.2s ease-in-out infinite}
.th-festa .stage .fig .bw svg{animation:dance .6s ease-in-out infinite alternate;transform-origin:50% 90%}
.th-festa .stage .fig.walking .bw svg{animation-duration:.35s}
@keyframes hop{50%{transform:translateY(-6px)}}
@keyframes dance{from{transform:rotate(-8deg) translateY(0)}to{transform:rotate(8deg) translateY(-8px)}}
@keyframes sit{50%{transform:translateY(-2px) rotate(1.5deg)}}
.tw{animation:tw 1.3s ease-in-out infinite alternate}.tw:nth-child(2n){animation-delay:.45s}.tw:nth-child(3n){animation-delay:.9s}
@keyframes tw{from{opacity:.45}to{opacity:1}}
.sm{animation:smoke 3s ease-out infinite}.sm:nth-child(2){animation-delay:1s}.sm:nth-child(3){animation-delay:2s}
@keyframes smoke{from{transform:translateY(0);opacity:.8}to{transform:translateY(-22px);opacity:0}}
.flick{animation:flick 2.4s ease-in-out infinite alternate}
@keyframes flick{from{opacity:.85}to{opacity:1}}
/* avatar */
.avrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.avprev{display:flex;justify-content:center;padding:6px 0;background:var(--soft);border-radius:14px}
.avprev svg{width:104px;height:145px}
.avprev{position:sticky;top:8px;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.stl{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--soft);cursor:pointer;font-weight:600;color:var(--ink)}
.stl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
@media (prefers-reduced-motion:reduce){.led{animation:none!important}.smk{animation:none!important;opacity:.6}.fig svg,.th-festa .floor::after,.tw,.sm,.flick{animation:none!important}#toast{transition:none}}
</style>
</head>
<body>
<div id="app"><div class="card"><h2>Eventos dos Bêbados</h2><p class="muted" style="margin:0">Carregando o grupo…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const app=document.getElementById('app');
const state={tab:'faltas',room:null,adminOn:true,members:[],guests:[],events:[],ctl:{},checkins:{},justifs:{},claims:{},approvals:{},avatars:{},pos:{},names:{},rules:{limite:2,dias:3,appLink:''},
  ready:{},loaded:false,uid:null,isOwner:false,canWrite:null,eventId:null,editing:null,draft:{},skipClaim:false,pendingV:null,rankOpen:{},rankMode:'mes',reactSeen:{},reactShow:{},reactInit:false,nodb:false,needLogin:false,slow:false,err:null,deferred:false};
let db=null,user=null,toastT=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const hash=s=>{let h=0;for(const c of String(s)){h=(h*31+c.charCodeAt(0))>>>0;}return h;};
const evTime=e=>new Date(e.date+'T'+(e.time||'00:00')+':00').getTime();
const fmtDay=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
const fmtShort=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const endTime=e=>{if(!e.fim)return null;let t=new Date(e.date+'T'+e.fim+':00').getTime();if(!(t>evTime(e)))t+=864e5;return t;};
/* o evento abre no horário de início e encerra sozinho no horário de término; o administrador pode encerrar antes ou reabrir depois */
const getStatus=e=>{
  const c=state.ctl[e.id]||{},now=Date.now(),end=endTime(e);
  if(c.status==='encerrado')return 'encerrado';
  if(c.status==='aberto')return (end&&now>=end&&!((c.at||0)>=end))?'encerrado':'aberto';
  if(end&&now>=end)return 'encerrado';
  return now>=evTime(e)?'aberto':'agendado';
};
const val=(id,def)=>Object.prototype.hasOwnProperty.call(state.draft,id)?state.draft[id]:(def==null?'':def);
const toMap=s=>Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));
const myMember=()=>{const a=state.approvals[state.uid];return a&&a.status==='aprovado'?state.members.find(m=>m.id===a.memberId)||null:null;};
const isLeader=e=>{const m=myMember();return !!(m&&e&&e.leaderId===m.id);};
const adm=()=>state.isOwner&&state.adminOn;
const canManage=e=>adm()||isLeader(e);
const readOnly=()=>state.canWrite===false;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),3200);}
async function w(fn,ok){try{await fn();if(ok)toast(ok);return true;}catch(e){toast(e&&(e.code==='invalid_argument'||e.code==='permission-denied')?'Você não tem permissão para essa ação.':'Não deu certo. Tente de novo.');return false;}}
function genCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';const u=new Uint32Array(6);crypto.getRandomValues(u);return Array.from(u,x=>A[x%A.length]).join('');}

/* regra de faltas, calculada sempre do zero a partir dos registros */
function analyze(m){
  const evs=state.events.filter(e=>!isOnline(e)&&getStatus(e)==='encerrado'&&(!m.since||e.date>=m.since)).sort((a,b)=>evTime(a)-evTime(b));
  const cnt={};let until=0;const hist=[];
  for(const e of evs){
    const t=evTime(e);
    if(t<until){hist.push({e,s:'suspenso'});continue;}
    if(state.checkins[e.id+'_'+m.id]){hist.push({e,s:'presente'});continue;}
    const j=state.justifs[e.id+'_'+m.id];
    if(j&&j.decision==='abonada'){hist.push({e,s:'abonada'});continue;}
    if(j&&!j.decision){hist.push({e,s:'analise'});continue;}
    hist.push({e,s:'falta'});
    const k=e.date.slice(0,7);cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]%state.rules.limite===0)until=t+state.rules.dias*864e5;
  }
  const mk=todayStr().slice(0,7);
  return {hist,mes:cnt[mk]||0,suspenso:until>Date.now(),until};
}
function curEvent(){
  const evs=state.events;if(!evs.length)return null;
  const picked=evs.find(e=>e.id===state.eventId);if(picked)return picked;
  const open=evs.find(e=>getStatus(e)==='aberto');if(open)return open;
  const t=todayStr();
  const next=evs.filter(e=>getStatus(e)==='agendado'&&e.date>=t).sort((a,b)=>evTime(a)-evTime(b))[0];
  if(next)return next;
  return evs.slice().sort((a,b)=>evTime(b)-evTime(a))[0];
}

/* bonequinho */
const SKINS=['#F7DCC4','#F4D2B4','#E3B48C','#C68A5C','#A0673F','#6B4226'];
const SKIN_N=['Muito clara','Clara','Média','Morena','Escura','Muito escura'];
const HAIRS=['#1B1410','#4A2E1A','#7A4B25','#B8843F','#E0C070','#A23B2A','#9AA0A6','#3B5BDB'];

/* temas */
const THEMES={padrao:'Padrão',festa:'Festa',cinema:'Cinema',jantar:'Jantar',churrasco:'Churrasco'};
function themeOf(e){
  const t=e.tema;if(t&&THEMES[t])return t;
  const s=(e.title||'').toLowerCase();
  if(/festa|balada|anivers|happy|role\b|rolê/.test(s))return 'festa';
  if(/cinema|filme|sess[aã]o/.test(s))return 'cinema';
  if(/jantar|almo[cç]o|restaurante|pizza|rod[ií]zio/.test(s))return 'jantar';
  if(/churras/.test(s))return 'churrasco';
  return 'padrao';

/* quem disse que vai / não vai a um evento */
function rsvpOf(e){
  const r={sim:[],nao:[],mine:null};
  for(const u in state.approvals){
    const a=state.approvals[u];if(!a||a.status!=='aprovado')continue;
    const v=((state.avatars[u]||{}).rsvp||{})[e.id];if(v!=='sim'&&v!=='nao')continue;
    const m=state.members.find(x=>x.id===a.memberId);if(!m)continue;
    r[v].push(m.name);if(u===state.uid)r.mine=v;
  }
  r.sim.sort((a,b)=>a.localeCompare(b));r.nao.sort((a,b)=>a.localeCompare(b));return r;
}

  const now=Date.now();

    const c=state.checkins[k],r=c&&c.react;if(!r||typeof r.at!=='number')continue;
    if(state.reactSeen[k]===r.at)continue;

  }
  state.reactInit=true;
}

function render(){
  if(state.nodb){app.innerHTML='<div class="card"><h1>Eventos dos Bêbados</h1><p>Não consegui conectar ao banco de dados. Confira a internet e abra o link de novo.</p></div>';return;}
  if(state.needLogin){app.innerHTML='<div class="card"><h1>Eventos dos Bêbados</h1><p class="muted" style="margin:0">Entre com a sua conta Google para ver a sala e validar presença.</p><button class="btn primary" data-act="login">Entrar com Google</button><p class="muted small" style="margin:0">Se o botão não funcionar, abra este link no Safari ou no Chrome.</p></div>';return;}
  let h=head();
  if(!state.loaded){
    h+='<div class="card"><p class="muted" style="margin:0">'+(state.slow?'Está demorando para conectar. Os dados podem estar desatualizados.':'Carregando o grupo…')+'</p></div>';
    if(state.err)h+='<div class="card"><span class="chip bad">Sem acesso aos dados</span></div>';
    app.innerHTML=h;return;
  }
  if(!state.isOwner){
    const acc=state.approvals[state.uid],req=state.claims[state.uid];
    if(!(acc&&acc.status==='aprovado')){
      if(readOnly())h+='<div class="card"><span class="chip warn">Você ainda não tem permissão de colaborador. Peça ao administrador.</span></div>';
      else if(acc&&acc.status==='recusado')h+='<div class="card"><h2>Acesso não liberado</h2><p class="muted" style="margin:0">O administrador não aprovou o seu pedido. Fale com ele no grupo.</p></div>';
      else if(req)h+='<div class="card"><h2>Pedido enviado</h2><p class="muted" style="margin:0">Aguarde o administrador aprovar o seu acesso. Depois é só abrir este link de novo.</p></div>';
      else if(state.uid)h+=claimHTML();
      else h+='<div class="card"><p style="margin:0">Não consegui identificar a sua conta. Abra este link de novo e entre com o Google.</p></div>';
      app.innerHTML=h;return;
    }
    if(readOnly())h+='<div class="card"><span class="chip warn">Você está só olhando: peça ao administrador permissão de colaborador para validar presença.</span></div>';
  }else if(!myMember()&&!state.skipClaim&&state.members.length&&state.uid){h+=claimHTML();app.innerHTML=h;return;}
  if(state.room){
    const re=state.events.find(x=>x.id===state.room);
    const ok=re&&(canManage(re)||!!(myMember()&&state.checkins[re.id+'_'+myMember().id]));
    if(!ok||(!canManage(re)&&getStatus(re)!=='aberto')){if(re&&ok)toast(isOnline(re)?'A sala foi encerrada.':'A presença foi encerrada.');state.room=null;state.tab='eventos';}
  }
  if(state.room){
    h+=roomScreen(state.events.find(x=>x.id===state.room));app.innerHTML=h;
    const q0=document.getElementById('qr');
    if(q0&&window.QRCode){try{new QRCode(q0,{text:q0.dataset.text,width:176,height:176,correctLevel:QRCode.CorrectLevel.M});}catch(e){q0.textContent='Não foi possível gerar o QR code.';}}
    autoValidate();return;
  }
  h+=tabsHTML();
  h+=({faltas:faltasHTML,eventos:eventosHTML,avatar:()=>avatarHTML()||'<div class="card"><div class="empty">Entre como membro para montar o seu avatar.</div></div>',admin:adminHTML}[state.tab]||faltasHTML)();
  app.innerHTML=h;
  const q=document.getElementById('qr');
  if(q&&window.QRCode){try{new QRCode(q,{text:q.dataset.text,width:176,height:176,correctLevel:QRCode.CorrectLevel.M});}catch(e){q.textContent='Não foi possível gerar o QR code.';}}
  autoValidate();
}
let pressing=false,pressT=null;
document.addEventListener('pointerdown',()=>{pressing=true;clearTimeout(pressT);pressT=setTimeout(released,1500);},true);
function released(){if(!pressing)return;pressing=false;clearTimeout(pressT);if(state.deferred){state.deferred=false;scheduleRender();}}
document.addEventListener('pointerup',()=>setTimeout(released,0),true);
document.addEventListener('pointercancel',released,true);
function scheduleRender(){
  if(pressing){state.deferred=true;return;}
  const a=document.activeElement;
  if(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){state.deferred=true;return;}
  render();
}
document.addEventListener('focusout',()=>{if(state.deferred){state.deferred=false;setTimeout(render,0);}});


/* movimento dos bonequinhos */
const REDUCE=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function seatFor(th,i,n){
  if(th==='cinema'){const per=5,row=Math.floor(i/per),col=i%per,cnt=Math.min(per,n-row*per);return {x:Math.min(.9,Math.max(.1,.5+(col-(cnt-1)/2)*.17)),y:row===0?.68:.97};}
  const a=(i/Math.max(1,n))*Math.PI*2-Math.PI/2;return {x:.5+.38*Math.cos(a),y:.8+.17*Math.sin(a)};
}
function pickTarget(p,th){
  const r=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  if(th==='festa'){p.tx=cl(p.x+(r()-.5)*.3,.08,.92);p.ty=cl(p.y+(r()-.5)*.25,.55,.97);p.wait=.2+r()*.8;}
  else{p.tx=.08+r()*.84;p.ty=.55+r()*.42;p.wait=1.5+r()*4;}
}
let lastT=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,Math.max(0,(t-lastT)/1000));lastT=t;
  const st=document.querySelector('.stage');if(!st)return;
  const W=st.clientWidth,H=st.clientHeight;if(!W||!H)return;
  const th=st.dataset.th,online=st.dataset.online==='1',eid=st.dataset.eid,nt=+st.dataset.nt||0,seated=!online&&(th==='cinema'||th==='jantar');
  const figs=st.querySelectorAll('.fig');const n=figs.length;
  figs.forEach((el,i)=>{
    const id=el.dataset.pid;let p=state.pos[id];
    if(!p){p=state.pos[id]={x:.2+Math.random()*.6,y:1.15,tx:null,ty:null,wait:0,dir:1};}
    let fixed=seated;
    if(seated){const sp=seatFor(th,i,n);p.tx=sp.x;p.ty=sp.y;}
    else if(online){
      const c=state.checkins[eid+'_'+id]||{};
      if(Number.isInteger(c.table)&&c.table>=0&&c.table<nt){const tp=tablePos(c.table,nt),ids=seatedAt(eid,c.table),a=(Math.max(0,ids.indexOf(id))/Math.max(1,ids.length))*Math.PI*2+Math.PI/2;const rx=Math.min(64,W*.17);p.tx=tp.x+Math.cos(a)*rx/W;p.ty=Math.min(1,tp.y+(Math.sin(a)*26+6)/H);fixed=true;}
      else if(typeof c.x==='number'&&typeof c.y==='number'){p.tx=Math.max(.05,Math.min(.95,c.x));p.ty=Math.max(.4,Math.min(.98,c.y));fixed=true;}
      else if(p.tx==null||p.fixed)pickTarget(p,th);
      p.fixed=fixed;
    }
    else if(p.tx==null)pickTarget(p,th);

    el.classList.toggle('walking',walking);el.classList.toggle('idle',!walking);
    const bw=el.firstChild;if(bw)bw.style.transform='scaleX('+p.dir+')';
  });
}

/* chamada de voz da mesa: ligação direta entre os aparelhos (WebRTC). Os convites de conexão viajam no registro de presença de cada um. */
const rtc={on:false,eid:null,table:-1,me:null,stream:null,muted:false,peers:{},tries:{},lastN:{},cleaning:false};
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
const rtcKey=()=>rtc.eid+'_'+rtc.me;

    if(pc.connectionState==='connected'){p.st='conectado';rtc.tries[id]=0;scheduleRender();}
    else if(pc.connectionState==='failed'){dropPeer(id);rtcSync();scheduleRender();}

async function offerTo(id){

    await p.pc.setLocalDescription(await p.pc.createOffer());await gathered(p.pc);
    if(rtc.peers[id]!==p)return;

    if(rtc.peers[id]!==p)return;

/* entra na chamada da mesa; chamado no toque de sentar, para o navegador liberar microfone e som */
async function joinCall(evn,me,key,t){

  catch(e){toast('Você sentou, mas o microfone não foi liberado para este site.');return;}
  const c=state.checkins[key];
  if(rtc.on||!c||c.table!==t||getStatus(evn)!=='aberto'){stream.getTracks().forEach(x=>x.stop());return;}
  Object.assign(rtc,{on:true,eid:evn.id,table:t,me:me.id,stream,muted:false,peers:{},tries:{},lastN:{}});
  state.checkins[key]={...c,call:true,rtc:{}};

function hangup(clear){
  if(!rtc.on)return;const key=rtcKey();
  Object.keys(rtc.peers).forEach(dropPeer);
  if(rtc.stream)rtc.stream.getTracks().forEach(t=>t.stop());
  Object.assign(rtc,{on:false,stream:null,muted:false,tries:{},lastN:{}});
  if(clear!==false&&state.checkins[key])db.doc('checkins/'+key).update({call:false,rtc:{}}).catch(()=>{});
  scheduleRender();
}
function rtcSync(){
  if(!rtc.on){
    /* marca de chamada que sobrou de uma sessão fechada no meio */
    const me=myMember();
    if(me&&state.loaded&&!rtc.cleaning&&!rtc.cleaned){rtc.cleaned=true;for(const k in state.checkins){const c=state.checkins[k];if(c.memberId===me.id&&c.call){rtc.cleaning=true;db.doc('checkins/'+k).update({call:false,rtc:{}}).catch(()=>{}).then(()=>{rtc.cleaning=false;});break;}}}
    return;
  }
  const ev=state.events.find(e=>e.id===rtc.eid),c=state.checkins[rtcKey()];
  if(!ev||getStatus(ev)!=='aberto'||!c||c.table!==rtc.table||!c.call){hangup(!!(c&&c.call));return;}
  const want=seatedAt(rtc.eid,rtc.table).filter(id=>id!==rtc.me&&(state.checkins[rtc.eid+'_'+id]||{}).call);
  for(const id of Object.keys(rtc.peers))if(!want.includes(id))dropPeer(id);
  for(const id of Object.keys(rtc.tries))if(!want.includes(id))delete rtc.tries[id];
  for(const id of Object.keys(rtc.lastN))if(!want.includes(id))delete rtc.lastN[id];
  for(const id of want){
    const their=((state.checkins[rtc.eid+'_'+id]||{}).rtc||{})[rtc.me],p=rtc.peers[id];
    if(rtc.me<id){
      if(!p){if((rtc.tries[id]||0)<4)offerTo(id);}
      else if(!p.done&&their&&their.t==='answer'&&their.n===p.n){p.done=true;p.pc.setRemoteDescription({type:'answer',sdp:their.sdp}).catch(()=>{dropPeer(id);});}
    }else if(their&&their.t==='offer'&&their.n!==rtc.lastN[id])answerTo(id,their);
  }
}
window.addEventListener('pagehide',()=>{if(rtc.on)hangup();});
/* convidados somem quando o evento deles é encerrado ou apagado (quem limpa é o app do administrador) */
const sweeping=new Set();
function sweepGuests(){
  if(!state.isOwner||!state.loaded||state.err)return;
  for(const g of state.guests){
    const ev=state.events.find(e=>e.id===g.guestOf);
    if((ev&&getStatus(ev)!=='encerrado')||sweeping.has(g.id))continue;
    sweeping.add(g.id);
    (async()=>{try{await db.doc('checkins/'+g.guestOf+'_'+g.id).delete();await db.doc('members/'+g.id).delete();}catch(e){sweeping.delete(g.id);}})();
  }
}
async function refreshProfiles(){
  if(!user)return;const ids=Object.keys(state.claims);if(!ids.length)return;
  try{const ps=await user.profiles(ids);let ch=false;for(const id of ids){const n=(ps[id]&&ps[id].name)||'';if(state.names[id]!==n){state.names[id]=n;ch=true;}}if(ch)scheduleRender();}catch(e){}
}
function subscribe(){
  sub('members',db.collection('members'),s=>{const all=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name));state.members=all.filter(m=>!m.guestOf);state.guests=all.filter(m=>m.guestOf);});
  sub('events',db.collection('events'),s=>{state.events=s.docs.map(d=>({id:d.id,...d.data()}));});
  sub('ctl',db.collection('ctl'),s=>{state.ctl=toMap(s);});
  sub('checkins',db.collection('checkins'),s=>{state.checkins=toMap(s);trackReacts();});
  sub('justifs',db.collection('justifs'),s=>{state.justifs=toMap(s);});
  sub('claims',db.collection('claims'),s=>{state.claims=toMap(s);refreshProfiles();});
  sub('approvals',db.collection('approvals'),s=>{state.approvals=toMap(s);const a=state.approvals[state.uid];if(state.err&&a&&a.status==='aprovado')location.reload();});
  sub('avatars',db.collection('avatars'),s=>{state.avatars=toMap(s);});
  sub('rules',db.doc('config/rules'),s=>{const r=s.exists?s.data():{};state.rules={limite:Math.max(1,r.limite||2),dias:Math.max(1,r.dias||3),appLink:r.appLink||''};});
  setTimeout(()=>{if(!state.loaded){state.slow=true;render();}},10000);
}

function boot(){
  const m=/^#v-([a-z0-9]+)-([A-Za-z0-9]+)$/i.exec(location.hash||'');
  if(m)state.pendingV={eventId:m[1],code:m[2]};
  let auth;
  try{firebase.initializeApp(FB);auth=firebase.auth();db=firebase.firestore();}catch(e){db=null;}
  if(!db){state.nodb=true;render();return;}
  user={profiles:async ids=>{const out={};await Promise.all(ids.map(async id=>{try{const s=await db.doc('profiles/'+id).get();if(s.exists)out[id]=s.data();}catch(e){}}));return out;}};
  let started=false;
  auth.onAuthStateChanged(async u=>{
    if(!u){if(started){location.reload();return;}state.needLogin=true;render();return;}
    if(started)return;started=true;
    state.needLogin=false;state.uid=u.uid;state.canWrite=true;render();
    db.doc('profiles/'+u.uid).set({name:u.displayName||''}).catch(()=>{});
    /* o primeiro a entrar vira o administrador; as regras do banco impedem trocar depois */
    try{
      const ref=db.doc('config/owner');let s=await ref.get();
      if(!s.exists){try{await ref.set({uid:u.uid,at:Date.now()});}catch(e){}s=await ref.get();}
      state.isOwner=s.exists&&s.data().uid===u.uid;
    }catch(e){}
    try{if(localStorage.getItem('presenca_adm')==='0')state.adminOn=false;}catch(e){}
    subscribe();
    let sig='';setInterval(()=>{const n=state.events.map(e=>e.id+getStatus(e)).join();if(n!==sig){sig=n;sweepGuests();rtcSync();scheduleRender();}},15000);
  });
}
/* atualização automática: se houver versão nova publicada, recarrega sozinho (menos no meio de uma sala ou chamada) */
const VER='20261112223309';
async function checkVer(){
  try{
    const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const nv=(await r.text()).trim();
    if(!nv||nv===VER||state.room||rtc.on||state.editing)return;
    if(new URLSearchParams(location.search).get('v')===nv)return;
    location.replace(location.pathname+'?v='+encodeURIComponent(nv)+location.hash);
  }catch(e){}
}
checkVer();setInterval(checkVer,120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkVer();});
boot();
})();
