<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eventos dos Bêbados</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="theme-color" content="#15110E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bêbados">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* Conceito: uma sala de encontro ilustrada no alto; quem validou a presença aparece dentro da sala, quem faltou fica na porta. Abas simples e cartões claros embaixo. */
:root{
  --bg:#15110E; --surface:#221B16; --soft:#2D2520; --ink:#F7EFE4; --muted:#B9AB9A; --line:#43372E;
  --accent:#F5A623; --accent-ink:#1E1305; --ok:#5FD694; --warn:#F3BD4F; --bad:#FF8478; --info:#86BEFF;
  --ok-bg:#173A29; --warn-bg:#40300D; --bad-bg:#45201D; --info-bg:#182E49;
  --wall:#3A2E26; --floor:#6B5238; --floor2:#5F4830; --door:#8A6B45;
  --font-head:'Space Grotesk',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-top:max(16px,calc(env(safe-area-inset-top,0px) + 10px));padding-bottom:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-head);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:24px} h2{font-size:18px} h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:0;background:transparent;padding:9px 4px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted);font-size:14px}
.tabs button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:0 10px 28px rgba(0,0,0,.28)}
.top h1{filter:drop-shadow(0 0 12px rgba(245,166,35,.35));background:linear-gradient(90deg,#FFC65C,#F5A623 45%,#FF7A4A);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.01em}
.room{box-shadow:0 10px 28px rgba(27,33,64,.10)}
.btn{transition:transform .08s ease,filter .12s ease}
.btn:active{transform:scale(.97)}
.item{transition:box-shadow .15s ease}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-width:0}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.good{background:var(--ok);color:#0E2A1B;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.tabs button:focus-visible,.fig:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
@media (hover:none),(max-width:820px){input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),select,textarea{font-size:16px !important}}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.empty{padding:22px 14px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
/* sala */
.room{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.wall{background:var(--wall);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:64px}
.wall .place{font-family:var(--font-head);font-weight:700;font-size:16px}
.door{width:34px;height:52px;border-radius:6px 6px 0 0;background:var(--door);position:relative;flex:none;margin-bottom:-12px}
.door::after{content:"";position:absolute;right:6px;top:26px;width:5px;height:5px;border-radius:50%;background:var(--wall)}
.floor{background:repeating-linear-gradient(90deg,var(--floor) 0 46px,var(--floor2) 46px 48px);padding:16px 10px 14px;display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center;align-items:flex-end;min-height:150px}
.floor .none{align-self:center;color:var(--ink);opacity:.7;font-weight:600;text-align:center;padding:10px}
.fig{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 4px 2px;width:74px;cursor:default;color:var(--ink)}
.fig.clickable{cursor:pointer}
.fig svg{display:block}
.fig span{font-size:12.5px;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fig.out svg{filter:grayscale(1) brightness(1.25);opacity:.7}
.fig.susp svg{filter:grayscale(1) sepia(.6) hue-rotate(-30deg);opacity:.6}
.doorstep{display:flex;flex-wrap:wrap;gap:2px 4px;justify-content:center;padding:10px;background:var(--soft);border-top:1px solid var(--line)}
.doorstep .cap{width:100%;text-align:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.codebox{font-family:var(--font-head);font-size:38px;font-weight:700;letter-spacing:.18em;text-align:center;padding:10px 6px;background:var(--soft);border-radius:12px;border:1px dashed var(--line)}
.qrwrap{background:#fff;padding:10px;border-radius:12px;display:inline-block;line-height:0}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.presente{background:var(--ok)} .dot.falta{background:var(--bad)} .dot.abonada{background:var(--info)} .dot.suspenso{background:var(--muted)} .dot.analise{background:var(--warn)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--soft);min-width:0}
.item p{margin:0;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#toast.show{opacity:1}

/* temas da sala */
.floor{position:relative;overflow:hidden}
.fig{position:relative;z-index:1}
.wall .decor{display:block;width:100%;height:60px}
.wall.themed{display:block;padding:0;min-height:0}
.wall.themed .wtxt{padding:12px 16px 6px}
.th-festa .wall{background:#2d1457;color:#fff}.th-festa .wall .muted{color:#d9ccf5}
.th-cinema .wall{background:#2a0a10;color:#fff}.th-cinema .wall .muted{color:#e7c9cf}
.th-jantar .wall{background:#efd9b0;color:#3b2a14}.th-jantar .wall .muted{color:#6b5636}
.th-churrasco .wall{background:#9bd8f5;color:#16384a}.th-churrasco .wall .muted{color:#2f5870}
.th-festa .floor{background:repeating-conic-gradient(#3a1b6e 0 25%,#4b2590 0 50%) 0 0/48px 48px}
.th-festa .floor::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(255,77,109,.38),transparent 38%),radial-gradient(circle at 75% 60%,rgba(77,171,247,.38),transparent 40%),radial-gradient(circle at 50% 90%,rgba(255,212,59,.3),transparent 35%);background-size:200% 200%;animation:lights 6s ease-in-out infinite alternate}
@keyframes lights{from{background-position:0 0}to{background-position:100% 100%}}
.th-cinema .floor{background:repeating-linear-gradient(90deg,#5d1020 0 22px,#4b0c19 22px 24px)}
.th-jantar .floor{background:repeating-linear-gradient(0deg,#b98a5b 0 30px,#a97b4d 30px 32px)}
.th-jantar .floor::before{content:"";position:absolute;left:10%;right:10%;bottom:12px;height:46px;border-radius:50%;background:#fff7e8;box-shadow:0 7px 0 #d8c29d}
.th-churrasco .floor{background:repeating-linear-gradient(90deg,#7cc06a 0 40px,#72b560 40px 80px)}
.th-festa .floor .fig,.th-cinema .floor .fig,.th-cinema .floor .none,.th-festa .floor .none{color:#fff}
.th-festa .floor .fig span,.th-cinema .floor .fig span{text-shadow:0 1px 3px rgba(0,0,0,.6)}
.th-churrasco .floor .fig,.th-churrasco .floor .none{color:#10321a}
.th-jantar .floor .fig,.th-jantar .floor .none{color:#2d1d0c}
.th-jantar .floor .fig span{text-shadow:0 1px 2px rgba(255,255,255,.5)}
/* movimento */
.floor.stage{display:block;height:240px;min-height:240px;padding:0}
.stage .fig{position:absolute;left:50%;top:115%;width:74px;height:100px;padding:0;margin:0;transform:translate(-50%,-100%);justify-content:flex-end}
.stage .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.floor.stage.online{height:390px;min-height:390px}
.stage.online.canwalk{cursor:pointer}
.mesa{position:absolute;transform:translate(-50%,-66%);width:min(112px,30%);height:60px;border-radius:50%;background:#8A5A2B;border:3px solid #5F3D1C;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.22);padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mesa::before{content:'';position:absolute;inset:-16px}
.mesa:active{filter:brightness(1.15)}
.stage.online .fig{pointer-events:none}
.mesa.mine{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--accent)}
a.btn{text-decoration:none;text-align:center;display:block}
.fig .bw{display:flex;justify-content:center}
.fig svg{overflow:visible}
.stage .fig{flex-direction:column-reverse;justify-content:flex-start;gap:4px}
.room .floor.stage .fig span{background:rgba(255,255,255,.9);color:#1B2140;padding:1px 7px;border-radius:9px;text-shadow:none;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.fig.guest span{font-style:italic}
.react{position:absolute;left:50%;top:-10px;font-size:28px;font-style:normal;line-height:1;pointer-events:none;z-index:6;animation:reactUp 4s ease-out forwards}
@keyframes reactUp{0%{opacity:0;transform:translate(-50%,12px) scale(.5)}12%{opacity:1;transform:translate(-50%,-6px) scale(1.2)}75%{opacity:1;transform:translate(-50%,-18px) scale(1)}100%{opacity:0;transform:translate(-50%,-36px) scale(1)}}
.carta{width:58px;height:82px;border-radius:10px;background:#fff;border:1px solid #C9CEDD;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:700;color:#1B2140;box-shadow:0 2px 6px rgba(27,33,64,.18);padding:0;cursor:pointer;touch-action:manipulation;font-family:var(--font-head)}
.carta b{font-size:24px;line-height:1.05}.carta i{font-size:24px;line-height:1.05;font-style:normal}
.carta.red{color:#D6336C}
.carta.man{box-shadow:0 0 0 2.5px #F2C230,0 2px 6px rgba(27,33,64,.18)}
.carta.mini{width:42px;height:60px;cursor:default}.carta.mini b,.carta.mini i{font-size:17px}
button.carta:not([disabled]):active{transform:translateY(-6px)}
button.carta[disabled]{opacity:.9;filter:saturate(.75);cursor:default}
.tmao.livre .carta{transform:translateY(-5px);box-shadow:0 0 0 2px var(--accent),0 6px 14px rgba(36,87,245,.28)}
.tmao.livre .carta.man{box-shadow:0 0 0 2.5px #F2C230,0 6px 14px rgba(36,87,245,.28)}
.imersa{position:relative;overflow:hidden;touch-action:pan-y;border-radius:18px}
.trilho{display:flex;width:200%;transition:transform .28s ease;align-items:flex-start}
.trilho>section{width:50%;min-width:0}
.trilho.p1{transform:translateX(-50%)}
.pjogo{padding:2px 2px 56px}
.psala{position:relative}
.ibar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:120;pointer-events:none}
.ibar>span{display:flex;gap:8px;align-items:center;pointer-events:auto}
.ibar .ticon{color:#1B2140;background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.18);border-color:transparent}
.ibar .ticon.on{background:#DDF3E8;color:#13804D}.ibar .ticon.off{background:#FBEBCB;color:#A86A00}.ibar .ticon.fora{background:#FADCDA;color:#C7362F}
.rpop{position:absolute;top:56px;right:10px;z-index:121;background:#fff;border-radius:16px;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 20px);box-shadow:0 8px 24px rgba(0,0,0,.22)}
.rrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.rfeed{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pdots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:120;background:rgba(255,255,255,.92);border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.pdots button{border:0;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:#586080;cursor:pointer}
.pdots button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* sala online em tela cheia: cabe exatamente entre o relógio e a barra de baixo do celular */
body:has(.room.grande){padding-top:max(8px,env(safe-area-inset-top,0px));padding-bottom:max(8px,env(safe-area-inset-bottom,0px))}
.room.grande{display:flex;flex-direction:column;min-height:calc(100vh - 28px);min-height:calc(100dvh - max(8px,env(safe-area-inset-top,0px)) - max(8px,env(safe-area-inset-bottom,0px)))}
.room.grande .wall{flex:0 0 auto;padding-top:46px}
.room.grande .wall.themed{padding-top:46px}
.room.grande .floor.stage.online{flex:1 1 auto;height:auto;min-height:420px}
.ticon{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:manipulation}
.ticon.on{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.ticon.off{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.ticon.fora{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.ticon:active{transform:scale(.92)}
.placar2{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;text-align:center}
.pt{display:flex;flex-direction:column;align-items:center;min-width:0}.pt .small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.pt b{font-size:30px;line-height:1.1;font-family:var(--font-head)}
.px{font-family:var(--font-head);font-weight:700;font-size:20px;color:var(--muted)}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);display:grid;grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:rgba(27,21,17,.97);border:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:60}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;padding:6px 4px;border-radius:12px;color:var(--muted);background:transparent;touch-action:manipulation}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="true"]{background:transparent;color:var(--accent)}
.tabs button[aria-current="true"] svg{filter:drop-shadow(0 0 6px rgba(245,166,35,.55))}
#app:has(.tabs){padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* o aviso flutuante aparece no alto, para não cobrir os botões de ação que ficam embaixo */
#toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:90;text-align:center;width:max-content;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.item.ev{--evc:#F5A623;border-left:5px solid var(--evc)}
.item.ev.evt-festa{--evc:#9B6BFF}.item.ev.evt-cinema{--evc:#E5484D}.item.ev.evt-jantar{--evc:#E0A458}.item.ev.evt-churrasco{--evc:#4CC38A}.item.ev.evt-online{--evc:#5AA9FF}
.item.ev.fim{opacity:.72}
.evtop{display:flex;gap:12px;align-items:center}
.evdata{flex:none;width:54px;height:58px;border-radius:12px;background:var(--evc);color:#1B1206;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.evdata b{font-family:var(--font-head);font-size:24px}.evdata span{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
button.chip{min-height:34px;padding:6px 12px;touch-action:manipulation}
.tabs{background:#1B1511 !important}
.ins-p{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px;animation:insEntra .45s both}
.ins-t{display:flex;gap:10px;align-items:flex-start}
.ins-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#1B1511;font-family:var(--font-head);font-weight:700;display:grid;place-items:center}
.ins-il{display:flex;justify-content:center}
.ins-barra,.ins-topo{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:#0E0B09;border:1px solid var(--line);border-radius:14px;padding:8px 14px;color:var(--muted)}
.ins-topo{font-size:14px;white-space:nowrap;padding:8px 10px}
.ins-topo b{color:var(--ink)}
.ins-url{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#1B1511;border-radius:10px;padding:6px 10px;font-size:13px}
.ins-apag{opacity:.35}
.ins-alvo{color:var(--accent);font-weight:700;border-radius:10px;padding:4px 8px;animation:insPulso 1.4s ease-in-out infinite}
.ins-rd{display:grid;place-items:center;border-radius:50%;padding:7px}
.ins-lista{width:100%;background:#0E0B09;border:1px solid var(--line);border-radius:14px;overflow:hidden;color:var(--muted)}
.ins-lista>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line)}
.ins-lista>div:last-child{border-bottom:0}
.ins-lista>.ins-alvo{border-radius:0;padding:9px 14px}
.ins-casa{display:grid;grid-template-columns:repeat(4,46px);gap:12px;justify-content:center;align-items:start;background:#0E0B09;border:1px solid var(--line);border-radius:14px;padding:12px;width:100%}
.ins-casa i{width:46px;height:46px;border-radius:12px;background:#2A221C}
.ins-app{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;font-size:10px}
.ins-app img{width:46px;height:46px;border-radius:12px}
.ins-app b{font-weight:600;color:var(--ink)}
@keyframes insPulso{0%,100%{box-shadow:0 0 0 0 rgba(245,166,35,.55)}60%{box-shadow:0 0 0 9px rgba(245,166,35,0)}}

<div id="app"><div class="card"><h2>Eventos dos Bêbados</h2><p class="muted" style="margin:0">Carregando o grupo…</p></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const app=document.getElementById('app');
const state={chat:{},chatAudio:{},chatErr:false,chatGrav:false,chatTocando:null,feats:{splits:{},posts:{},polls:{}},featErr:false,evPg:null,rachaNovo:false,rachaSel:null,enqNova:false,alertasVistoAntes:0,chamada:false,conqSel:null,evAba:'atv',telaAt:0,tSig:'',tSigAt:0,perfil:null,raceAt:0,jogoP:null,impVer:false,impN:null,painel:0,reactOpen:false,games:{},gamesErr:false,myHands:{},handSubs:{},tab:'faltas',room:null,adminOn:true,members:[],guests:[],events:[],ctl:{},checkins:{},justifs:{},claims:{},approvals:{},avatars:{},pos:{},names:{},rules:{limite:2,dias:3,appLink:''},
  ready:{},loaded:false,uid:null,isOwner:false,canWrite:null,eventId:null,editing:null,draft:{},skipClaim:false,pendingV:null,rankOpen:{},rankMode:'mes',reactSeen:{},reactShow:{},reactInit:false,nodb:false,needLogin:false,slow:false,err:null,deferred:false};
let db=null,user=null,toastT=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const hash=s=>{let h=0;for(const c of String(s)){h=(h*31+c.charCodeAt(0))>>>0;}return h;};
const evTime=e=>new Date(e.date+'T'+(e.time||'00:00')+':00').getTime();
const fmtDay=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});
const fmtShort=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});
const endTime=e=>{if(!e.fim)return null;let t=new Date(e.date+'T'+e.fim+':00').getTime();if(!(t>evTime(e)))t+=864e5;return t;};
/* o evento abre no horário de início e encerra sozinho no horário de término; o administrador pode encerrar antes ou reabrir depois */
/* ao entrar na sala: na chamada online todo mundo fica presente; no evento presencial o líder ganha a presença sozinho,
   quando o evento começa de verdade: no horário marcado, ou quando ele mesmo abre a sala mais cedo no dia do evento (ver evComecou) */
function entraPresente(evn){
  const me=myMember();if(!me||!evn||readOnly()||getStatus(evn)!=='aberto'||state.checkins[evn.id+'_'+me.id])return;
  if(!isOnline(evn)&&!(isLeader(evn)&&evComecou(evn)&&!analyze(me).suspenso))return;
  const key=evn.id+'_'+me.id,data={eventId:evn.id,memberId:me.id,at:Date.now(),by:isOnline(evn)?'online':'leader'};
  state.checkins[key]=data;w(()=>db.doc('checkins/'+key).set(data));scheduleRender();
}
const EV_ANTES=12*36e5;
/* chamada online: quem está nela manda um sinal de vida a cada minuto (checkins.vivo) e marca "fora" ao sair.
   Sem ninguém dentro, a chamada conta como encerrada (2 minutos de folga depois de criada). */
const LIG_VIVO=5*60000;
const naChamada=c=>!!c&&!c.fora&&(c.vivo||0)>Date.now()-LIG_VIVO;
const ligVazia=(e,folga)=>{if(!e||!e.chamada)return false;const c=state.ctl[e.id]||{};if(Date.now()-Math.max(e.createdAt||0,c.at||0)<(folga||15000))return false;for(const k in state.checkins){const x=state.checkins[k];if(x.eventId===e.id&&naChamada(x))return false;}return true;};
const getStatus=e=>{
  const c=state.ctl[e.id]||{},now=Date.now(),end=endTime(e);
  if(c.status==='encerrado')return 'encerrado';
  if(ligVazia(e))return 'encerrado';
  /* sala presencial aberta com mais de 12 horas de antecedência não vale: o evento segue agendado (sem presença, sem encerrar) até começar */
  if(c.status==='aberto'&&e.modo!=='online'&&now<evTime(e)&&(c.at||0)<evTime(e)-EV_ANTES)return 'agendado';
  if(c.status==='aberto')return (end&&now>=end&&!((c.at||0)>=end))?'encerrado':'aberto';
  if(end&&now>=end)return 'encerrado';
  return now>=evTime(e)?'aberto':'agendado';
};

/* regra de faltas, calculada sempre do zero a partir dos registros */
function analyze(m){
  const evs=state.events.filter(e=>!isOnline(e)&&getStatus(e)==='encerrado'&&(!m.since||e.date>=m.since)).sort((a,b)=>evTime(a)-evTime(b));
  const cnt={};let until=0;const hist=[];
  for(const e of evs){
    const t=evTime(e);
    if(t<until){hist.push({e,s:'suspenso'});continue;}
    if(state.checkins[e.id+'_'+m.id]){hist.push({e,s:'presente'});continue;}
    const j=state.justifs[e.id+'_'+m.id];
    if(j&&j.decision==='abonada'){hist.push({e,s:'abonada'});continue;}
    if(j&&!j.decision){hist.push({e,s:'analise'});continue;}
    hist.push({e,s:'falta'});
    const k=e.date.slice(0,7);cnt[k]=(cnt[k]||0)+1;
    if(cnt[k]%state.rules.limite===0)until=t+state.rules.dias*864e5;
  }
  const mk=todayStr().slice(0,7);
  return {hist,mes:cnt[mk]||0,suspenso:until>Date.now(),until};
}
function curEvent(){
  const evs=state.events;if(!evs.length)return null;
  const picked=evs.find(e=>e.id===state.eventId);if(picked)return picked;
  const open=evs.find(e=>getStatus(e)==='aberto');if(open)return open;
  const t=todayStr();
  const next=evs.filter(e=>getStatus(e)==='agendado'&&e.date>=t).sort((a,b)=>evTime(a)-evTime(b))[0];
  if(next)return next;
  return evs.slice().sort((a,b)=>evTime(b)-evTime(a))[0];
}

/* ===================== TEMAS DE DATAS ESPECIAIS =====================
   O app muda de cara sozinho, pela data do celular: 20 dias antes até 20 dias depois da data.
   Natal termina em 29/12 e o Réveillon entra em 30/12; o Réveillon termina 2 dias antes de o Carnaval começar, se encostarem.
   Para testar: ?tema=natal|reveillon|carnaval|junina|nenhum  ou  ?dia=2026-12-24 */
const TEMAS={natal:{n:'Natal',ic:'🎄'},reveillon:{n:'Réveillon',ic:'🥂'},carnaval:{n:'Carnaval',ic:'🎭'},junina:{n:'Festa junina',ic:'🌽'}};
function pascoaDe(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia);}
function temaDe(dt){
  const y=dt.getFullYear(),D=864e5,t=new Date(y,dt.getMonth(),dt.getDate()).getTime(),em=(a,b)=>t>=a.getTime()&&t<=b.getTime();
  if(em(new Date(y,11,5),new Date(y,11,29)))return 'natal';
  if(em(new Date(y,11,30),new Date(y,11,31)))return 'reveillon';
  const carn=pascoaDe(y).getTime()-47*D,c0=new Date(carn-20*D),c1=new Date(carn+20*D);
  if(em(c0,c1))return 'carnaval';
  if(em(new Date(y,0,1),new Date(Math.min(new Date(y,0,20).getTime(),c0.getTime()-2*D))))return 'reveillon';
  if(em(new Date(y,5,4),new Date(y,6,14)))return 'junina';
  return '';
}

const T_SOBE={2:4,4:8,8:10,10:12},T_NOME={4:'Truco',8:'Seis',10:'Nove',12:'Doze'},T_META=12;
const tForca=c=>T_MAN[c]||(T_RANKS.indexOf(c[0])+1);
const tTeam=s=>s%2;
/* nas chamadas novas o truco é da mesa em que a pessoa está; nas salas antigas de jogos continua na mesa 0 */
const tMesa=e=>isJogos(e)?0:jMesa(e);
const tGid=e=>isJogos(e)?e.id+'_truco':jEsc(e)+'_truco';
const tGame=e=>state.games[tGid(e)]||null;
const tSeat=g=>g&&Array.isArray(g.seats)?g.seats.findIndex(x=>x.uid===state.uid):-1;
const tNome=(g,s)=>{const x=g.seats[s],m=x&&state.members.find(y=>y.id===x.mid);return m?m.name:'?';};
const tTimeNome=(g,t)=>g.seats.map((x,i)=>i).filter(i=>tTeam(i)===t).map(i=>tNome(g,i)).join(' e ');
function tDeck(){
  const d=[];for(const r of T_RANKS)for(const s of 'oecp')d.push(r+s);
  const u=new Uint32Array(d.length);crypto.getRandomValues(u);
  for(let i=d.length-1;i>0;i--){const j=u[i]%(i+1);const t=d[i];d[i]=d[j];d[j]=t;}
  return d;
}
/* quem ganhou a mão olhando o resultado das rodadas: null = continua, -1 = ninguém, 0 ou 1 = time */
function tVencedor(res){
  const a=res[0],b=res[1],c=res[2];
  if(res.length===2){
    if(a!==-1&&a===b)return a;      /* ganhou as duas primeiras */
    if(a===-1&&b!==-1)return b;     /* empatou a primeira: quem faz a segunda leva */
    if(a!==-1&&b===-1)return a;     /* empatou a segunda: vale a primeira */
    return null;
  }
  if(res.length===3){if(c!==-1)return c;if(a!==-1)return a;return -1;}
  return null;
}
function tMinhas(e,g){const h=state.myHands[tGid(e)];return h&&g&&h.n===g.n&&Array.isArray(h.cards)?h.cards:null;}
function tWatch(e){
  const gid=tGid(e);if(state.handSubs[gid]||!state.uid)return;state.handSubs[gid]=true;
  db.doc('hands/'+gid+'_'+state.uid).onSnapshot(s=>{state.myHands[gid]=s.exists?s.data():null;scheduleRender();},()=>{state.handSubs[gid]=false;});
}
async function tGravar(e,G){state.games[tGid(e)]=G;render();return w(()=>db.doc('games/'+tGid(e)).set(G));}
async function tDar(e,G){
  const n=G.seats.length,d=tDeck(),gid=tGid(e);
  G.n=(G.n||0)+1;
  const sai=(G.dealer+1)%n;
  G.hand={turn:sai,lead:sai,vaza:0,mesa:[],res:[],valor:2,subiu:null,pedido:null};
  const eu=G.seats.findIndex(x=>x.uid===state.uid);
  if(eu>=0)state.myHands[gid]={n:G.n,cards:d.slice(eu*3,eu*3+3)};
  state.games[gid]=G;render();
  return w(async()=>{
    await Promise.all(G.seats.map((x,i)=>db.doc('hands/'+gid+'_'+x.uid).set({n:G.n,cards:d.slice(i*3,i*3+3)})));
    await db.doc('games/'+gid).set(G);
  });
}
async function tComecar(e){
  const ids=seatedAt(e.id,tMesa(e));
  if(ids.length!==2&&ids.length!==4)return toast('O truco precisa de 2 ou 4 jogadores na mesa.');
  const seats=ids.map(mid=>({mid,uid:avUid({id:mid})||null}));
  if(seats.some(x=>!x.uid))return toast('Só quem tem conta no app pode jogar.');
  const u=new Uint32Array(seats.length);crypto.getRandomValues(u);
  for(let i=seats.length-1;i>0;i--){const j=u[i]%(i+1);const t=seats[i];seats[i]=seats[j];seats[j]=t;}
  return tDar(e,{status:'playing',seats,score:[0,0],dealer:u[0]%seats.length,n:0,msg:'Partida começou. Boa sorte!',ult:null,at:Date.now()});
}
async function tFimMao(e,G,time,motivo){
  const pts=time===-1?0:G.hand.valor;
  if(time!==-1)G.score[time]+=pts;
  G.msg=(motivo?motivo+' ':'')+(time===-1?'Mão empatada: ninguém pontua.':tTimeNome(G,time)+' '+(G.seats.length>2?'ganharam':'ganhou')+' a mão: +'+pts+'.');
  if(G.score[0]>=T_META||G.score[1]>=T_META){
    G.status='over';G.winner=G.score[0]>=T_META?0:1;G.hand=null;
    return tGravar(e,G);
  }
  G.dealer=(G.dealer+1)%G.seats.length;
  return tDar(e,G);
}
async function tJogar(e,carta){
  const g=tGame(e),eu=tSeat(g);if(!g||g.status!=='playing'||eu<0||!g.hand)return;
  if(g.hand.turn!==eu||g.hand.pedido)return;
  const minhas=tMinhas(e,g);if(!minhas||!minhas.includes(carta))return;
  const gid=tGid(e),G=JSON.parse(JSON.stringify(g)),H=G.hand,n=G.seats.length,resto=minhas.filter(c=>c!==carta);
  state.myHands[gid]={n:G.n,cards:resto};
  db.doc('hands/'+gid+'_'+state.uid).set({n:G.n,cards:resto}).catch(()=>{});
  H.mesa.push({s:eu,c:carta});
  if(H.mesa.length<n){H.turn=(eu+1)%n;return tGravar(e,G);}
  /* fecha a rodada */
  let best=-1,tops=[];
  for(const p of H.mesa){const f=tForca(p.c);if(f>best){best=f;tops=[p];}else if(f===best)tops.push(p);}
  const times=[...new Set(tops.map(p=>tTeam(p.s)))],r=times.length===1?times[0]:-1;
  H.res.push(r);
  G.ult={mesa:H.mesa,r,s:r===-1?-1:tops[0].s};
  const prox=r===-1?H.lead:tops[0].s;
  H.mesa=[];H.vaza++;H.lead=prox;H.turn=prox;
  G.msg=r===-1?'Rodada empatada.':tNome(G,tops[0].s)+' fez a rodada.';
  const v=tVencedor(H.res);
  if(v!==null)return tFimMao(e,G,v,'');
  return tGravar(e,G);
}
async function tPedir(e){
  const g=tGame(e),eu=tSeat(g);if(!g||g.status!=='playing'||eu<0||!g.hand)return;
  const h=g.hand;if(h.turn!==eu||h.pedido||h.subiu===tTeam(eu)||!T_SOBE[h.valor])return;
  const G=JSON.parse(JSON.stringify(g));G.hand.pedido={by:eu,to:T_SOBE[h.valor]};
  G.msg=tNome(G,eu)+' pediu '+T_NOME[G.hand.pedido.to]+'!';
  return tGravar(e,G);
}
async function tResponder(e,acao){
  const g=tGame(e),eu=tSeat(g);if(!g||g.status!=='playing'||eu<0||!g.hand)return;
  const p=g.hand.pedido;if(!p||tTeam(eu)===tTeam(p.by))return;
  const G=JSON.parse(JSON.stringify(g)),H=G.hand;
  if(acao==='correr'){H.pedido=null;return tFimMao(e,G,tTeam(p.by),tNome(G,eu)+' correu.');}
  H.valor=p.to;H.subiu=tTeam(p.by);
  if(acao==='aumentar'&&T_SOBE[p.to]){H.pedido={by:eu,to:T_SOBE[p.to]};G.msg=tNome(G,eu)+' aumentou para '+T_NOME[H.pedido.to]+'!';}
  else{H.pedido=null;G.msg=tNome(G,eu)+' aceitou. Valendo '+H.valor+'.';}
  return tGravar(e,G);
}

/* ===================== A CIDADE DORME (sala presencial, com narração) =====================
   Jogo de roda com papéis secretos: cidadãos, assassino(s), anjo e detetive.
   O celular de quem começa a partida é o NARRADOR: ele fala em voz alta e faz o jogo andar (noite, manhã, votação).
   Cada jogador age no próprio celular. A partida fica em games/{evento}_cid; papéis e escolhas da noite ficam
   embaralhados (como no Impostor), não trancados. */
const CID_PAPEL={c:'Cidadão',a:'Assassino',j:'Anjo',d:'Detetive'};
const CID_DICA={c:'Você não tem poder especial. Descubra quem é o assassino na conversa e vote.',a:'À noite, você escolhe no celular quem vai morrer. De dia, disfarce.',j:'À noite, você escolhe alguém para proteger do assassino.',d:'À noite, você investiga uma pessoa e descobre se ela é assassino.'};
const CID_MIN=5,CID_VER=10000,CID_VOTO=300000,CID_K=window.__cidK||1; /* CID_K encurta as esperas nos testes */
const cGid=e=>jEsc(e)+'_cid';
const cGame=e=>state.games[cGid(e)]||null;
const cQtdAss=n=>n>=8?2:1;
const cSeg=g=>(iDec(g&&g.seg)||{}).r||{};
const cAlvo=s=>(iDec(s)||{}).t||'';
const cNoite=f=>['dorme','na','fa','nj','fj','nd','fd'].includes(f);
const cRelogio=fim=>{const s=Math.max(0,Math.ceil((fim-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
setInterval(()=>{const el=document.getElementById('cidTimer');if(el)el.textContent=cRelogio(+el.dataset.fim);},1000);
function cVenc(r,vivos){const a=vivos.filter(m=>r[m]==='a').length;return a===0?'cidade':(a>=vivos.length-a?'assassinos':'');}
function cEntrar(e,entra){const me=myMember();if(!me)return;return w(()=>db.doc('games/'+cGid(e)).set({jog:{[state.uid]:entra?me.id:null}},{merge:true}),entra?'':'Você saiu do jogo.');}
function cGrava(e,dados){return db.doc('games/'+cGid(e)).update(dados);}
function cComecar(e){
  const g=cGame(e)||{},js=iJog(e,g),me=myMember();
  if(!me||!(g.jog&&g.jog[state.uid]))return toast('Entre no jogo primeiro.');
  if(js.length<CID_MIN)return toast('A Cidade Dorme precisa de pelo menos '+CID_MIN+' participantes.');
  const u=new Uint32Array(js.length);crypto.getRandomValues(u);
  const ordem=js.map((x,i)=>({mid:x.mid,k:u[i]})).sort((a,b)=>a.k-b.k).map(x=>x.mid),na=cQtdAss(js.length),r={};
  ordem.forEach((m,i)=>{r[m]=i<na?'a':i===na?'j':i===na+1?'d':'c';});
  state.cidVer=false;
  const L=cidLoc;L.gid=cGid(e);L.fn=(g.fn||0)+1;L.ini=Date.now();L.rand=12000*CID_K;L.indo=false;L.avisou=false;cFalar(cFala({fase:'prep'}));
  cGrava(e,{status:'jogo',host:state.uid,n:(g.n||0)+1,rod:js.map(x=>x.mid),vivos:js.map(x=>x.mid),seg:iCod({r}),fase:'prep',fn:(g.fn||0)+1,ft:Date.now(),noite:0,visto:{},votos:{},ka:'',pj:'',di:'',up:'',dok:false,forca:false,fechar:false,morto:'',salvo:false,elim:'',empate:false,venc:''}).catch(()=>toast('Não consegui começar a partida.'));
}
/* ---------- narração (só no celular narrador) ---------- */
const cidLoc={gid:'',fn:-1,ini:0,falaFim:0,rand:0,indo:false,tok:0,tf:null,texto:''};
function cFalar(txt){
  const L=cidLoc,id=++L.tok,est=Math.max(1500,txt.length*75)*CID_K;L.falaFim=0;L.texto=txt;clearTimeout(L.tf);
  let falou=false;
  try{
    if('speechSynthesis' in window&&!window.__cidMudo){
      const u=new SpeechSynthesisUtterance(txt),vs=speechSynthesis.getVoices()||[],v=vs.find(x=>/^pt[-_]BR/i.test(x.lang))||vs.find(x=>/^pt/i.test(x.lang));
      u.lang='pt-BR';if(v)u.voice=v;u.rate=0.95;u.onend=()=>{if(L.tok===id&&!L.falaFim)L.falaFim=Date.now();};
      /* no iPhone, falar logo depois de cancelar pode engolir a frase: só interrompe se estiver falando, e espera um instante */
      if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(()=>{try{if(L.tok===id)speechSynthesis.speak(u);}catch(e){}},150);}
      else speechSynthesis.speak(u);
      falou=true;
    }
  }catch(e){}
  /* se a voz não avisar que terminou (ou não existir), segue pelo tempo estimado da frase */
  L.tf=setTimeout(()=>{if(L.tok===id&&!L.falaFim)L.falaFim=Date.now();},falou?est+4000:est);
}
function cFala(g){
  const r=cSeg(g),dois=Object.values(r).filter(x=>x==='a').length>1,A=dois?'Assassinos':'Assassino';
  switch(g.fase){
    case 'prep':return 'Atenção. Os papéis serão revelados. Escondam os seus celulares.';
    case 'papeis':return 'Olhem agora o seu papel. Ele some em dez segundos.';
    case 'dorme':return (g.noite>1?'A noite caiu de novo. ':'')+'A cidade dorme. Todos fechem os olhos e escondam a tela do celular.';
    case 'na':return A+', '+(dois?'abram os olhos e escolham':'abra os olhos e escolha')+' no celular quem vai morrer.';
    case 'fa':return A+', '+(dois?'fechem os olhos e escondam':'feche os olhos e esconda')+' o celular.';
    case 'nj':return 'Anjo, abra os olhos e escolha no celular quem você quer proteger.';
    case 'fj':return 'Anjo, feche os olhos e esconda o celular.';
    case 'nd':return 'Detetive, abra os olhos e escolha no celular quem você quer investigar.';
    case 'fd':return 'Detetive, feche os olhos e esconda o celular.';
    case 'manha':return 'A cidade acorda. Todos abram os olhos. '+(g.morto?'Esta noite, '+iNome(g.morto)+' foi assassinado.':g.salvo?'Esta noite, alguém foi atacado, mas o anjo salvou.':'Esta noite, ninguém morreu.');
    case 'dia':return 'Agora conversem. Quem é o assassino? Quando decidirem, abram a votação no celular do narrador.';
    case 'voto':return 'Agora conversem e descubram o assassino. Cada um vota no seu celular. A noite volta quando todos votarem, ou em cinco minutos.';
    case 'res':return g.elim?'A cidade eliminou '+iNome(g.elim)+'. '+iNome(g.elim)+' era '+CID_PAPEL[r[g.elim]||'c'].toLowerCase()+'.':(g.empate?'Deu empate. Ninguém foi eliminado.':'Ninguém votou. Ninguém foi eliminado.');
    case 'fim':{const as=Object.keys(r).filter(m=>r[m]==='a').map(iNome);return 'Fim de jogo. '+(g.venc==='cidade'?'A cidade venceu!':'Os assassinos venceram!')+' '+(as.length>1?'Os assassinos eram ':'O assassino era ')+as.join(' e ')+'.';}
  }
  return '';
}
let cidLock=null;
function cAcordado(liga){try{if(liga){if(!cidLock&&navigator.wakeLock)navigator.wakeLock.request('screen').then(l=>{cidLock=l;l.addEventListener('release',()=>{cidLock=null;});}).catch(()=>{});}else if(cidLock){cidLock.release().catch(()=>{});cidLock=null;}}catch(e){}}
/* o narrador faz o jogo andar: roda a cada instante só no celular de quem é o narrador da partida */
function cTick(){
  let narrando=false;
  for(const gid in state.games){
    if(!gid.endsWith('_cid'))continue;
    const g=state.games[gid];if(!g||g.status!=='jogo'||g.host!==state.uid)continue;
    const e=state.events.find(x=>x.id===gid.slice(0,-4).split('-m')[0]);if(!e||getStatus(e)!=='aberto'||cGid(e)!==gid)continue;
    narrando=true;cAnda(e,g,gid);break;
  }

function cAnda(e,g,gid){
  const L=cidLoc,t=Date.now();
  if(L.gid!==gid||L.fn!==g.fn){L.gid=gid;L.fn=g.fn;L.ini=t;L.rand=(9000+Math.random()*6000)*CID_K;L.indo=false;L.avisou=false;cFalar(cFala(g));scheduleRender();}
  if(L.indo)return;
  const dt=L.falaFim?t-L.falaFim:-1,r=cSeg(g),vivos=Array.isArray(g.vivos)?g.vivos:[],tem=p=>vivos.some(m=>r[m]===p),S=5000*CID_K;
  const vai=d=>{L.indo=true;cGrava(e,{...d,fn:(g.fn||0)+1,ft:Date.now()}).catch(()=>{L.indo=false;});};
  switch(g.fase){
    case 'prep':if(dt>=3000*CID_K)vai({fase:'papeis'});break;
    case 'papeis':if(dt>=0&&t-L.ini>=(CID_VER+1500)*CID_K)vai({fase:'dorme',noite:1,ka:'',pj:'',di:'',dok:false});break;
    case 'dorme':if(dt>=S)vai({fase:'na'});break;
    case 'na':if(g.ka||t-L.ini>60000*CID_K)vai({fase:'fa'});break;
    case 'fa':if(dt>=S)vai({fase:'nj'});break;
    case 'nj':if(tem('j')?(g.pj||t-L.ini>45000*CID_K):dt>=L.rand)vai({fase:'fj'});break;
    case 'fj':if(dt>=S)vai({fase:'nd'});break;
    case 'nd':if(tem('d')?(g.dok||t-L.ini>60000*CID_K):dt>=L.rand)vai({fase:'fd'});break;
    case 'fd':if(dt>=S){const alvo=cAlvo(g.ka),prot=cAlvo(g.pj),morto=alvo&&vivos.includes(alvo)&&alvo!==prot?alvo:'',nv=vivos.filter(m=>m!==morto);
      vai({fase:'manha',morto,salvo:!!alvo&&alvo===prot,vivos:nv,up:g.pj||'',venc:cVenc(r,nv)});}break;
    case 'manha':if(dt>=2500*CID_K)vai(g.venc?{fase:'fim'}:{fase:'voto',votos:{},fechar:false});break;
    case 'voto':{const v=g.votos||{},passou=t-L.ini;
      if(!L.avisou&&passou>=(CID_VOTO-60000)*CID_K&&passou<CID_VOTO*CID_K){L.avisou=true;const fim=L.falaFim;cFalar('Falta um minuto para a noite voltar.');L.falaFim=fim||Date.now();}
      if(vivos.every(m=>m in v)||g.fechar||passou>=CID_VOTO*CID_K){
      const cont={};vivos.forEach(m=>{const x=v[m];if(x&&vivos.includes(x))cont[x]=(cont[x]||0)+1;});
      const ord=Object.entries(cont).sort((a,b)=>b[1]-a[1]),elim=ord.length&&(ord.length===1||ord[0][1]>ord[1][1])?ord[0][0]:'',nv=vivos.filter(m=>m!==elim);
      vai({fase:'res',elim,empate:!elim&&ord.length>0,vivos:nv,venc:cVenc(r,nv)});}}break;
    case 'res':if(dt>=4000*CID_K)vai(g.venc?{fase:'fim'}:{fase:'dorme',noite:(g.noite||1)+1,ka:'',pj:'',di:'',dok:false,morto:'',salvo:false});break;
  }
}

const fM=mid=>state.members.concat(state.guests).find(m=>m.id===mid)||{id:mid,name:'?'};
const fPresentes=e=>state.members.concat(guestsOf(e)).filter(m=>jNaSala(e,m.id)).map(m=>m.id);
/* joga quem sentou pelo próprio celular e também quem foi colocado na mesa por outra pessoa (está sem celular) */
const fProprios=(e,g)=>iJog(e,g).map(x=>x.mid);
/* conv = {pessoa sem celular: uid de quem a colocou na mesa}; ela joga pelo celular dessa pessoa */
const fConv=g=>(g&&g.conv)||{};
const fJog=(e,g)=>{if(!g)return [];const p=fPresentes(e),pr=fProprios(e,g),c=fConv(g);return pr.concat(Object.keys(c).filter(m=>c[m]&&(g.jog||{})[c[m]]&&p.includes(m)&&!pr.includes(m)));};
const fTemCel=(g,m)=>Object.values((g&&g.jog)||{}).includes(m);
const fMeus=g=>{const c=fConv(g);return Object.keys(c).filter(m=>c[m]===state.uid&&!fTemCel(g,m));};
/* cada um age pelo próprio celular; quem está sem celular age pelo celular de quem a colocou na mesa */
const fPosso=(g,mid)=>{const me=myMember();return !!(g&&((me&&me.id===mid)||(fConv(g)[mid]===state.uid&&!fTemCel(g,mid))));};
const fSorteia=a=>{const u=new Uint32Array(1);crypto.getRandomValues(u);return a[u[0]%a.length];};
const fEmbaralha=a=>{const u=new Uint32Array(a.length);crypto.getRandomValues(u);return a.map((x,i)=>({x,k:u[i]})).sort((p,q)=>p.k-q.k).map(o=>o.x);};
const fRnd=seed=>{let t=seed>>>0;return ()=>{t=(t+0x6D2B79F5)>>>0;let r=Math.imul(t^(t>>>15),1|t);r=(r+Math.imul(r^(r>>>7),61|r))^r;return ((r^(r>>>14))>>>0)/4294967296;};};

function fNovaRodada(e,k,g,rod){
  const d={};
  if(k==='cav'){d.ordem=fEmbaralha(rod);d.seed=fSorteia([...Array(9000).keys()])+1;}
  if(k==='rol'){const alvo=fSorteia(rod),base=fAng(rod,alvo),de=+g.ang||0;d.alvo=alvo;d.de=de;d.ang=base+360*Math.ceil((de+1440-base)/360);}

    d.alvo=alvo;d.quem=quem===alvo?rod[(i+1)%n]:quem;d.de=de;d.ang=base+360*Math.ceil((de+1440-base)/360);d.esc='';d.sug=-1;}
  if(k==='bom'){d.com=fSorteia(rod);d.dur=8000+fSorteia([...Array(200).keys()])*100;d.est=false;d.perdeu='';}
  if(k==='car'){const c={};rod.forEach(m=>{c[m]={v:1+fSorteia([...Array(13).keys()]),s:fSorteia([0,1,2,3])};});d.cartas=c;d.extra={};}
  if(k==='sin'){d.esp=2500+fSorteia([...Array(50).keys()])*100;d.tempos={};d.queimou={};d.fim=false;}
  if(k==='pro'){const us=Array.isArray(g.usadas)?g.usadas:[];let l=F_FRASES.map((x,i)=>i).filter(i=>!us.includes(i));if(!l.length)l=F_FRASES.map((x,i)=>i);d.fr=fSorteia(l);d.usadas=us.concat(d.fr).slice(-24);d.votos={};d.rev=false;}
  if(k==='mai'){const us=Array.isArray(g.usadas)?g.usadas:[];let l=F_ESCOLHAS.map((x,i)=>i).filter(i=>!us.includes(i));if(!l.length)l=F_ESCOLHAS.map((x,i)=>i);d.q=fSorteia(l);d.usadas=us.concat(d.q).slice(-24);d.votos={};d.rev=false;}

  if(F_MESA.includes(k))Object.assign(d,gNovaRodada(e,k,g,rod));

}

function fEtapa(k,g,el){
  if(k==='cav'){const fim=F_CAV_ESPERA+fCavT((g.rod||[]).length-1)+900;return el<F_CAV_ESPERA?Math.floor(el/1000):el<fim?5:6;}

/* animações e relógios: roda várias vezes por segundo, só mexe em posição/ângulo (não redesenha a tela) */

  const k=state.jogoQual.slice(2),e=state.events.find(x=>x.id===state.jogoP),g=e&&fGame(e,k);
  if(!g||g.st!=='jogo')return;

      const m=elc.dataset.m,pos=ordem.indexOf(m),T=fCavT(pos),r=fRnd((g.seed||1)*31+rod.indexOf(m)*977),per=2200+r()*1800,fase=r()*6.28,amp=.05+r()*.05;
      let p=t<=0?0:t>=T?1:t/T+amp*Math.sin(t/per*6.28+fase)*(1-t/T)*Math.min(1,t/1500);
      p=Math.max(0,Math.min(1,p));elc.style.transform='translateX('+(p*larg).toFixed(1)+'px)';elc.classList.toggle('corre',t>0&&t<T);
    });}
  }

  if(k==='bom'&&!g.est){
    const b=document.querySelector('.fbomba');if(b)b.style.animationDuration=Math.max(.12,.6-el/(g.dur||1)*.48).toFixed(2)+'s';
    if(el>=(g.dur||0)&&!L.mandou&&!L.velho&&(g.host===state.uid||el>=(g.dur||0)+4000)){L.mandou=true;fUp(e,k,{est:true,perdeu:g.com});}
  }
  if(k==='sin'&&!g.fim){
    const tp=g.tempos||{},qm=g.queimou||{},todos=rod.every(m=>(m in tp)||qm[m]);
    if((todos||el>=(g.esp||0)+5000)&&!L.mandou&&!L.velho&&(g.host===state.uid||el>=(g.esp||0)+8000)){L.mandou=true;fUp(e,k,{fim:true});}

}

/* SORTEIO DO EVENTO (amigo oculto, amigo bebida...): opcional, um por evento, criado pelo líder ou pelo administrador.
   Fica em polls/s_{evento} (tipo 'sorteio'). Quem cria escolhe os participantes e o app sorteia na hora.
   O resultado de cada integrante fica em hands/s_{evento}_{uid}, que só a própria pessoa consegue ler.
   Pessoa de fora recebe um link (convites/{chave}, tipo 'amigo'). As dicas de presente ficam em votos[uid].dica

let stT=null;
function stSync(){
  clearTimeout(stT);

    if(!db||!myMember())return;
    for(const [k,c] of Object.entries(state.convites||{})){
      if(!c||c.tipo!=='amigo'||!c.tirou)continue;const q=(state.feats.polls||{})[c.sid];if(!q||q.tipo!=='sorteio')continue;
      const d=stDica(q,c.tirou);if((c.dicaDele||'')!==d){try{db.doc('convites/'+k).update({dicaDele:d}).catch(()=>{});}catch(e){}}
    }

    for(const [id,q] of Object.entries(state.feats.polls||{})){

      const e=state.events.find(x=>x.id===q.eventId);if(e&&Date.now()<stFim(e))continue;if(!e&&!state.loaded)continue;

/* números de cada membro para conquistas (só eventos presenciais) */
function statsDe(m){
  const evs=state.events.filter(e=>!isOnline(e)&&evComecou(e)),pres=evs.filter(e=>state.checkins[e.id+'_'+m.id]),a=analyze(m);
  let cur=0,best=0;
  for(const h of a.hist){if(h.s==='presente'){cur++;if(cur>best)best=cur;}else if(h.s==='falta'||h.s==='suspenso')cur=0;}
  let primeiro=0;
  for(const e of pres){
    const ats=state.members.map(x=>state.checkins[e.id+'_'+x.id]).filter(c=>c&&typeof c.at==='number').map(c=>c.at),meu=state.checkins[e.id+'_'+m.id].at;
    if(ats.length>1&&typeof meu==='number'){const mn=Math.min(...ats);if(meu===mn&&ats.filter(x=>x===mn).length===1)primeiro++;}
  }
  const porMes={};for(const h of a.hist){const k=String(h.e.date).slice(0,7);(porMes[k]=porMes[k]||[]).push(h.s);}
  return {n:pres.length,seq:cur,best,primeiro,
    lider:evs.filter(e=>e.leaderId===m.id).length,
    abon:Object.values(state.justifs).some(j=>j.memberId===m.id&&j.decision==='abonada'),
    perfeito:Object.values(porMes).some(v=>v.length>=2&&v.every(x=>x==='presente'))};
}

  const rows=state.members.map(m=>({m,a:analyze(m)})).sort((x,y)=>(y.a.suspenso-x.a.suspenso)||(y.a.mes-x.a.mes)||x.m.name.localeCompare(y.m.name));
  return '<div class="card"><h2>Placar do mês</h2><div class="legend"><span><i style="background:var(--ok)"></i>Presente</span><span><i style="background:var(--bad)"></i>Falta</span><span><i style="background:var(--info)"></i>Abonada</span><span><i style="background:var(--warn)"></i>Em análise</span><span><i style="background:var(--muted)"></i>Suspenso</span></div><div class="list">'+
   rows.map(({m,a})=>{
     const lim=state.rules.limite;
     const chip=a.suspenso?'<span class="chip bad">Suspenso até '+fmtShort(a.until)+'</span>':(a.mes>=lim?'<span class="chip warn">Suspensão já cumprida</span>':(a.mes===lim-1&&lim>1?'<span class="chip warn">Atenção: mais uma falta suspende</span>':'<span class="chip ok">Em dia</span>'));
     const pres=a.hist.filter(h=>h.s==='presente').length;
     return '<div class="item"><div class="row between"><h3>'+esc(m.name)+'</h3>'+chip+'</div><div class="small">Faltas neste mês: <b>'+a.mes+' de '+lim+'</b> - Presenças no total: '+pres+'</div>'+
       '<div class="dots" aria-label="Últimos eventos">'+(a.hist.slice(-12).map(h=>'<span class="dot '+h.s+'" title="'+esc(h.e.title)+'"></span>').join('')||'<span class="muted small">Sem eventos encerrados.</span>')+'</div></div>';
   }).join('')+'</div></div>';
}
function abonoHTML(){
  const me=myMember();let pedir='';
  if(me&&!readOnly()){
    const mine=analyze(me).hist.filter(h=>h.s==='falta'&&!state.justifs[h.e.id+'_'+me.id]);
    if(mine.length)pedir='<h3>Suas faltas sem justificativa</h3>'+'<div class="list">'+mine.map(h=>'<div class="item"><b>'+esc(h.e.title)+'</b><span class="small muted">'+esc(fmtDay(h.e.date))+'</span><label>Motivo<textarea id="jt_'+esc(h.e.id)+'" placeholder="Explique o que aconteceu">'+esc(val('jt_'+h.e.id))+'</textarea></label><button class="btn primary" data-act="sendJ" data-e="'+esc(h.e.id)+'">Enviar pedido</button></div>').join('')+'</div>';
  }
  const js=Object.entries(state.justifs).map(([k,j])=>({k,j})).sort((a,b)=>(b.j.at||0)-(a.j.at||0));
  return '<div class="card"><h2>Abono de faltas</h2>'+pedir+(js.length?(pedir?'<h3>Pedidos do grupo</h3>':'')+'<div class="list">'+js.map(({k,j})=>{
    const ev=state.events.find(e=>e.id===j.eventId),mem=state.members.find(m=>m.id===j.memberId);if(!ev||!mem)return '';
    const votes=Object.values(j.votes||{}),sim=votes.filter(v=>v==='sim').length,nao=votes.filter(v=>v==='nao').length,mine=(j.votes||{})[state.uid];
    const dec=j.decision;
    let h='<div class="item"><div class="row between"><h3>'+esc(mem.name)+'</h3><span class="chip '+(dec==='abonada'?'info':dec==='negada'?'bad':'warn')+'">'+(dec==='abonada'?'Abonada':dec==='negada'?'Negada':'Em votação')+'</span></div>'+
      '<div class="small muted">'+esc(ev.title)+' - '+esc(fmtDay(ev.date))+'</div><p>'+esc(j.text)+'</p><div class="small">Votos do grupo: <b>'+sim+' a favor</b> e <b>'+nao+' contra</b></div>';
    if(!dec&&me&&j.memberId!==me.id&&!readOnly())h+='<div class="row"><button class="btn'+(mine==='sim'?' primary':'')+'" data-act="vote" data-k="'+esc(k)+'" data-v="sim">Votar a favor</button><button class="btn'+(mine==='nao'?' primary':'')+'" data-act="vote" data-k="'+esc(k)+'" data-v="nao">Votar contra</button></div>';
    if((adm()||isLeader(ev))&&!readOnly()&&(!dec||adm()))h+='<div class="row"><span class="small muted">'+(isLeader(ev)?'Você é o líder deste evento:':'Decisão do administrador:')+'</span><button class="btn good" data-act="decide" data-k="'+esc(k)+'" data-v="abonada">Abonar</button><button class="btn danger" data-act="decide" data-k="'+esc(k)+'" data-v="negada">Negar</button></div>';
    return h+'</div>';
  }).join('')+'</div>':(pedir?'':'<div class="empty">Nenhum pedido de abono.</div>'))+'</div>';
}

  if(state.needLogin&&instalarPede()){app.innerHTML=instalarHTML();return;}
  if(state.needLogin){app.innerHTML='<div class="card" style="align-items:center;text-align:center;padding:28px 18px"><img src="icone-192.png" width="104" height="104" alt="" style="border-radius:26px"><h1>Eventos dos Bêbados</h1><p class="muted" style="margin:0">Entre com a sua conta Google para ver a sala e validar presença.</p><button class="btn primary" data-act="login">Entrar com Google</button><p class="muted small" style="margin:0">Se o botão não funcionar, abra este link no Safari ou no Chrome.</p></div>';return;}

    h+='<div class="card"><p class="muted" style="margin:0">'+(state.slow?'Está demorando para conectar. Os dados podem estar desatualizados.':'Carregando o grupo…')+'</p></div>';
    if(state.err)h+='<div class="card"><span class="chip bad">Sem acesso aos dados</span></div>';
    app.innerHTML=h;return;
  }
  if(!state.isOwner){
    const acc=state.approvals[state.uid],req=state.claims[state.uid];
    if(!(acc&&acc.status==='aprovado')){
      if(readOnly())h+='<div class="card"><span class="chip warn">Você ainda não tem permissão de colaborador. Peça ao administrador.</span></div>';
      else if(acc&&acc.status==='recusado')h+='<div class="card"><h2>Acesso não liberado</h2><p class="muted" style="margin:0">O administrador não aprovou o seu pedido. Fale com ele no grupo.</p></div>';

      else if(state.uid)h+=claimHTML();
      else h+='<div class="card"><p style="margin:0">Não consegui identificar a sua conta. Abra este link de novo e entre com o Google.</p></div>';
      app.innerHTML=h;return;
    }
    if(readOnly())h+='<div class="card"><span class="chip warn">Você está só olhando: peça ao administrador permissão de colaborador para validar presença.</span></div>';
  }else if(!myMember()&&!state.skipClaim&&state.members.length&&state.uid){h+=claimHTML();app.innerHTML=h;return;}
  if(state.room){
    const re=state.events.find(x=>x.id===state.room);
    const ok=re&&(canManage(re)||!!(myMember()&&state.checkins[re.id+'_'+myMember().id]));
    if(!ok||(!canManage(re)&&getStatus(re)!=='aberto')){if(re&&ok)toast(isOnline(re)?'A sala foi encerrada.':'A presença foi encerrada.');state.room=null;state.tab='eventos';}
  }
  if(state.room){
    const sala0=state.events.find(x=>x.id===state.room);h=(isOnline(sala0)?'':h)+roomScreen(sala0);app.innerHTML=h;
    const q0=document.getElementById('qr');
    if(q0&&window.QRCode){try{new QRCode(q0,{text:q0.dataset.text,width:176,height:176,correctLevel:QRCode.CorrectLevel.M});}catch(e){q0.textContent='Não foi possível gerar o QR code.';}}
    autoValidate();return;
  }
  if(pushPede()){app.innerHTML=h+pushPedeHTML();return;}
  h+=tabsHTML();
  h+='<div class="tela'+(Date.now()-state.telaAt<450&&state.tab!=='chat'?' entra':'')+'">'+({faltas:faltasHTML,eventos:eventosHTML,chat:chatHTML,alertas:alertasHTML,avatar:()=>avatarHTML()||'<div class="card"><div class="empty">Entre como membro para montar o seu avatar.</div></div>',admin:adminHTML}[state.tab]||faltasHTML)()+'</div>';
  app.innerHTML=h;
  if(window.QRCode)app.querySelectorAll('.qrpix').forEach(el=>{try{new QRCode(el,{text:el.dataset.text,width:168,height:168,correctLevel:QRCode.CorrectLevel.M});}catch(e){el.textContent='Use o botão de copiar.';}});
  const q=document.getElementById('qr');
  if(q&&window.QRCode){try{new QRCode(q,{text:q.dataset.text,width:176,height:176,correctLevel:QRCode.CorrectLevel.M});}catch(e){q.textContent='Não foi possível gerar o QR code.';}}
  chatAjusta();
  autoValidate();
}
let pressing=false,pressT=null;
document.addEventListener('pointerdown',()=>{pressing=true;clearTimeout(pressT);pressT=setTimeout(released,1500);},true);
function released(){if(!pressing)return;pressing=false;clearTimeout(pressT);if(state.deferred){state.deferred=false;scheduleRender();}}
document.addEventListener('pointerup',()=>setTimeout(released,0),true);
document.addEventListener('pointercancel',released,true);
function scheduleRender(){
  if(pressing){state.deferred=true;return;}
  const a=document.activeElement;
  if(a&&app.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){state.deferred=true;return;}
  render();
}
document.addEventListener('focusout',()=>{if(state.deferred){state.deferred=false;setTimeout(render,0);}});


/* movimento dos bonequinhos */
const REDUCE=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function seatFor(th,i,n){
  if(th==='cinema'){const per=5,row=Math.floor(i/per),col=i%per,cnt=Math.min(per,n-row*per);return {x:Math.min(.9,Math.max(.1,.5+(col-(cnt-1)/2)*.17)),y:row===0?.68:.97};}
  const a=(i/Math.max(1,n))*Math.PI*2-Math.PI/2;return {x:.5+.38*Math.cos(a),y:.8+.17*Math.sin(a)};
}
function pickTarget(p,th){
  const r=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  if(th==='festa'){p.tx=cl(p.x+(r()-.5)*.3,.08,.92);p.ty=cl(p.y+(r()-.5)*.25,.55,.97);p.wait=.2+r()*.8;}
  else{p.tx=.08+r()*.84;p.ty=.55+r()*.42;p.wait=1.5+r()*4;}
}
let lastT=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(.1,Math.max(0,(t-lastT)/1000));lastT=t;
  const st=document.querySelector('.stage');if(!st)return;
  const W=st.clientWidth,H=st.clientHeight;if(!W||!H)return;
  const th=st.dataset.th,online=st.dataset.online==='1',eid=st.dataset.eid,nt=+st.dataset.nt||0,seated=!online&&(th==='cinema'||th==='jantar');
  const figs=st.querySelectorAll('.fig');const n=figs.length;
  figs.forEach((el,i)=>{
    const id=el.dataset.pid;let p=state.pos[id];
    if(!p){p=state.pos[id]={x:.2+Math.random()*.6,y:1.15,tx:null,ty:null,wait:0,dir:1};}
    let fixed=seated;
    if(seated){const sp=seatFor(th,i,n);p.tx=sp.x;p.ty=sp.y;}
    else if(online){
      const c=state.checkins[eid+'_'+id]||{};
      if(Number.isInteger(c.table)&&c.table>=0&&c.table<nt){const tp=tablePos(c.table,nt),ids=seatedAt(eid,c.table),a=(Math.max(0,ids.indexOf(id))/Math.max(1,ids.length))*Math.PI*2+Math.PI/2;const rx=Math.min(64,W*.17);p.tx=tp.x+Math.cos(a)*rx/W;p.ty=Math.min(1,tp.y+(Math.sin(a)*26+6)/H);fixed=true;}
      else if(typeof c.x==='number'&&typeof c.y==='number'){p.tx=Math.max(.05,Math.min(.95,c.x));p.ty=Math.max(.4,Math.min(.98,c.y));fixed=true;}
      else if(p.tx==null||p.fixed)pickTarget(p,th);
      p.fixed=fixed;
    }
    else if(p.tx==null)pickTarget(p,th);
    const dx=(p.tx-p.x)*W,dy=(p.ty-p.y)*H,d=Math.hypot(dx,dy);
    let walking=false;
    if(d<3){
      if(!fixed){p.wait-=dt;if(p.wait<=0)pickTarget(p,th);}
    }else if(REDUCE){p.x=p.tx;p.y=p.ty;}
    else{
      const step=(fixed?(online?95:70):th==='festa'?55:38)*dt;
      if(step>=d){p.x=p.tx;p.y=p.ty;}else{p.x+=dx/d*step/W;p.y+=dy/d*step/H;walking=true;if(Math.abs(dx)>1)p.dir=dx>0?1:-1;}
    }
    el.style.left=(p.x*100).toFixed(2)+'%';el.style.top=(p.y*100).toFixed(2)+'%';el.style.zIndex=String(Math.round(p.y*100));
    el.classList.toggle('walking',walking);el.classList.toggle('idle',!walking);
    const bw=el.firstChild;if(bw)bw.style.transform='scaleX('+p.dir+')';
  });
}
requestAnimationFrame(frame);

/* ações */
async function validate(e,code){
  const me=myMember();
  if(!me)return toast('Escolha quem você é primeiro.');
  if(getStatus(e)!=='aberto')return toast('A presença deste evento não está aberta.');
  const a=analyze(me);if(a.suspenso)return toast('Você está suspenso até '+fmtShort(a.until)+'.');
  if(String(code||'').trim().toUpperCase()!==e.code)return toast('Código incorreto.');
  const key=e.id+'_'+me.id,data={eventId:e.id,memberId:me.id,at:Date.now(),by:'self'};
  state.checkins[key]=data;state.room=e.id;render();
  w(()=>db.doc('checkins/'+key).set(data),'Presença confirmada!').then(ok=>{if(!ok&&state.checkins[key]===data){delete state.checkins[key];render();}});
}
function autoValidate(){
  const p=state.pendingV;if(!p||!state.loaded||!myMember())return;
  state.pendingV=null;try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  const e=state.events.find(x=>x.id===p.eventId);
  if(e){validate(e,p.code);}else toast('Evento do QR code não encontrado.');
}

    return;

  if(act==='rename'){const n=((document.getElementById('mn_'+d.m)||{}).value||'').trim();if(!n)return;if(await w(()=>db.doc('members/'+d.m).update({name:n}),'Nome salvo.'))delete state.draft['mn_'+d.m];return;}
  if(act==='release'){await w(async()=>{await db.doc('approvals/'+d.u).delete();await db.doc('claims/'+d.u).delete();},'Acesso removido.');return;}

    delete state.draft['dm_'+d.m];return;
  }
});

function sub(name,ref,fn){

/* chamada de voz da mesa: ligação direta entre os aparelhos (WebRTC). Os convites de conexão viajam no registro de presença de cada um. */
const rtc={on:false,eid:null,table:-1,me:null,stream:null,muted:false,peers:{},tries:{},lastN:{},cleaning:false};
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
const rtcKey=()=>rtc.eid+'_'+rtc.me;
function gathered(pc){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();const t=setTimeout(r,3000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);r();}});});}
function newPeer(id){
  const pc=new RTCPeerConnection(ICE),au=document.createElement('audio');
  au.autoplay=true;au.setAttribute('playsinline','');au.style.display='none';document.body.appendChild(au);
  const p={pc,au,n:0,done:false,st:'conectando'};
  rtc.stream.getTracks().forEach(t=>pc.addTrack(t,rtc.stream));
  pc.ontrack=e=>{au.srcObject=e.streams[0];const pr=au.play();if(pr&&pr.catch)pr.catch(()=>{});};
  pc.onconnectionstatechange=()=>{
    if(rtc.peers[id]!==p)return;
    if(pc.connectionState==='connected'){p.st='conectado';rtc.tries[id]=0;scheduleRender();}
    else if(pc.connectionState==='failed'){dropPeer(id);rtcSync();scheduleRender();}
  };
  rtc.peers[id]=p;return p;
}
function dropPeer(id){const p=rtc.peers[id];if(!p)return;delete rtc.peers[id];try{p.pc.onconnectionstatechange=null;p.pc.close();}catch(e){}p.au.srcObject=null;p.au.remove();}
async function offerTo(id){
  rtc.tries[id]=(rtc.tries[id]||0)+1;
  const p=newPeer(id);p.n=Date.now();
  try{
    await p.pc.setLocalDescription(await p.pc.createOffer());await gathered(p.pc);
    if(rtc.peers[id]!==p)return;
    await db.doc('checkins/'+rtcKey()).update({['rtc.'+id]:{t:'offer',sdp:p.pc.localDescription.sdp,n:p.n}});
  }catch(e){if(rtc.peers[id]===p)dropPeer(id);}
}
async function answerTo(id,o){
  dropPeer(id);rtc.lastN[id]=o.n;
  const p=newPeer(id);p.n=o.n;p.done=true;
  try{
    await p.pc.setRemoteDescription({type:'offer',sdp:o.sdp});
    await p.pc.setLocalDescription(await p.pc.createAnswer());await gathered(p.pc);
    if(rtc.peers[id]!==p)return;
    await db.doc('checkins/'+rtcKey()).update({['rtc.'+id]:{t:'answer',sdp:p.pc.localDescription.sdp,n:o.n}});
  }catch(e){if(rtc.peers[id]===p)dropPeer(id);}
}
/* entra na chamada da mesa; chamado no toque de sentar, para o navegador liberar microfone e som */
async function joinCall(evn,me,key,t){
  if(rtc.on)return;
  if(!navigator.mediaDevices||!window.RTCPeerConnection){toast('Este navegador não suporta chamada de voz.');return;}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});}
  catch(e){toast('Você sentou, mas o microfone não foi liberado para este site.');return;}
  const c=state.checkins[key];
  if(rtc.on||!c||c.table!==t||getStatus(evn)!=='aberto'){stream.getTracks().forEach(x=>x.stop());return;}
  Object.assign(rtc,{on:true,eid:evn.id,table:t,me:me.id,stream,muted:false,peers:{},tries:{},lastN:{}});
  state.checkins[key]={...c,call:true,rtc:{}};
  rtcSync();render();
  if(!await w(()=>db.doc('checkins/'+key).update({call:true,rtc:{}}))){hangup(false);render();}
}
function hangup(clear){
  if(!rtc.on)return;const key=rtcKey();
  Object.keys(rtc.peers).forEach(dropPeer);
  if(rtc.stream)rtc.stream.getTracks().forEach(t=>t.stop());
  Object.assign(rtc,{on:false,stream:null,muted:false,tries:{},lastN:{}});
  if(clear!==false&&state.checkins[key])db.doc('checkins/'+key).update({call:false,rtc:{}}).catch(()=>{});
  scheduleRender();
}
function rtcSync(){
  if(!rtc.on){
    /* marca de chamada que sobrou de uma sessão fechada no meio */
    const me=myMember();
    if(me&&state.loaded&&!rtc.cleaning&&!rtc.cleaned){rtc.cleaned=true;for(const k in state.checkins){const c=state.checkins[k];if(c.memberId===me.id&&c.call){rtc.cleaning=true;db.doc('checkins/'+k).update({call:false,rtc:{}}).catch(()=>{}).then(()=>{rtc.cleaning=false;});break;}}}
    return;
  }
  const ev=state.events.find(e=>e.id===rtc.eid),c=state.checkins[rtcKey()];
  if(!ev||getStatus(ev)!=='aberto'||!c||c.table!==rtc.table||!c.call){hangup(!!(c&&c.call));return;}
  const want=seatedAt(rtc.eid,rtc.table).filter(id=>id!==rtc.me&&(state.checkins[rtc.eid+'_'+id]||{}).call);
  for(const id of Object.keys(rtc.peers))if(!want.includes(id))dropPeer(id);
  for(const id of Object.keys(rtc.tries))if(!want.includes(id))delete rtc.tries[id];
  for(const id of Object.keys(rtc.lastN))if(!want.includes(id))delete rtc.lastN[id];
  for(const id of want){
    const their=((state.checkins[rtc.eid+'_'+id]||{}).rtc||{})[rtc.me],p=rtc.peers[id];
    if(rtc.me<id){
      if(!p){if((rtc.tries[id]||0)<4)offerTo(id);}
      else if(!p.done&&their&&their.t==='answer'&&their.n===p.n){p.done=true;p.pc.setRemoteDescription({type:'answer',sdp:their.sdp}).catch(()=>{dropPeer(id);});}
    }else if(their&&their.t==='offer'&&their.n!==rtc.lastN[id])answerTo(id,their);
  }
}

/* convidados somem quando o evento deles é encerrado ou apagado (quem limpa é o app do administrador) */
const sweeping=new Set();
function ligBate(){
  try{const me=myMember();if(!me||readOnly())return;const id=(rtc.on&&rtc.eid)||state.room,e=id&&state.events.find(x=>x.id===id);

/* o dono do app ou quem criou a chamada grava o encerramento da chamada vazia, para ela sumir de vez para todo mundo */
const ligFechando=new Set();
function ligFecha(){
  try{if(readOnly()||!state.loaded)return;for(const e of state.events){if(!isOnline(e)||!e.chamada||ligFechando.has(e.id)||(state.ctl[e.id]||{}).status==='encerrado'||!ligVazia(e,45000))continue;
    if(!(state.isOwner||isLeader(e)))continue;ligFechando.add(e.id);db.doc('ctl/'+e.id).set({status:'encerrado',at:Date.now()}).catch(()=>{ligFechando.delete(e.id);});}}catch(x){}
}
function sweepGuests(){
  if(!state.isOwner||!state.loaded||state.err)return;
  for(const e of state.events){
    if(!isOnline(e)||getStatus(e)!=='encerrado'||sweeping.has(e.id))continue;
    const fim=Math.max(endTime(e)||0,(state.ctl[e.id]||{}).at||0,evTime(e));
    if(Date.now()-fim<12*36e5)continue;
    sweeping.add(e.id);
    (async()=>{try{
      for(const k of Object.keys(state.checkins))if(state.checkins[k].eventId===e.id)await db.doc('checkins/'+k).delete();
      await db.doc('ctl/'+e.id).delete();await db.doc('games/'+e.id+'_truco').delete();await db.doc('events/'+e.id).delete();
    }catch(x){sweeping.delete(e.id);}})();
  }
  for(const g of state.guests){
    const ev=state.events.find(e=>e.id===g.guestOf);
    if((ev&&getStatus(ev)!=='encerrado')||sweeping.has(g.id))continue;
    sweeping.add(g.id);
    (async()=>{try{await db.doc('checkins/'+g.guestOf+'_'+g.id).delete();await db.doc('members/'+g.id).delete();}catch(e){sweeping.delete(g.id);}})();
  }
}
async function refreshProfiles(){
  if(!user)return;const ids=Object.keys(state.claims);if(!ids.length)return;
  try{const ps=await user.profiles(ids);let ch=false;for(const id of ids){const n=(ps[id]&&ps[id].name)||'';if(state.names[id]!==n){state.names[id]=n;ch=true;}}if(ch)scheduleRender();}catch(e){}

function subscribe(){
  sub('members',db.collection('members'),s=>{const all=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0)||String(a.name).localeCompare(b.name));state.members=all.filter(m=>!m.guestOf);state.guests=all.filter(m=>m.guestOf);});

  db.collection('chat').onSnapshot(sn=>{state.chat=toMap(sn);state.chatErr=false;chatLimpa();if(!chatPinta(true))scheduleRender();},()=>{state.chatErr=true;scheduleRender();});
  db.collection('convites').onSnapshot(s=>{state.convites=toMap(s);stSync();scheduleRender();},()=>{});
  ['splits','posts','polls'].forEach(c=>db.collection(c).onSnapshot(s=>{state.feats[c]=toMap(s);state.featErr=false;if(c==='polls')stSync();scheduleRender();},()=>{state.featErr=true;scheduleRender();}));
  db.collection('games').onSnapshot(s=>{state.games=toMap(s);state.gamesErr=false;scheduleRender();},()=>{state.gamesErr=true;scheduleRender();});
  sub('rules',db.doc('config/rules'),s=>{const r=s.exists?s.data():{};state.rules={limite:Math.max(1,r.limite||2),dias:Math.max(1,r.dias||3),appLink:r.appLink||''};});
  setTimeout(()=>{if(!state.loaded){state.slow=true;render();}},10000);
}

const VER='20261113221914';
async function checkVer(){
  try{
    const r=await fetch('version.txt?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;
    const nv=(await r.text()).trim();
    if(!nv||nv===VER||state.room||rtc.on||state.editing)return;

  }catch(e){}
}
